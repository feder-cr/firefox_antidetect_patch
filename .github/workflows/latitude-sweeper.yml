# ─────────────────────────────────────────────────────────────────────────────
# latitude-sweeper.yml — the protection against a forgotten build node.
#
# stop-node in release.yml deletes the node of its run. This is for what stop-node
# cannot see or leaves on purpose: a job killed outright, a create that answered after
# the delete, a watch that crashed while the legs were running. It deletes only the
# nodes we started (the name ci<run>a<attempt><leg>) that no run needs:
# past GUARD_HOURS, or with their run or their own leg finished. It cancels a run whose leg waits on a label no
# runner will come for, long after that run's own watch would have. A schedule runs on
# the default branch only: on any other branch this does not exist yet. A node made by hand has another
# name and is never touched. Rules and cases: scripts/ci/latitude_node.py, sweep().
# ─────────────────────────────────────────────────────────────────────────────
name: latitude-sweeper

on:
  schedule:
    - cron: '7,37 * * * *'
  # Right after a release run ends, whichever way (done, failed, cancelled): what its stop-node left on is not left for the next half hour.
  # The sweeper deletes only nodes no run needs, so a run still going is spared.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    environment: latitude-builder
    timeout-minutes: 10
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: Delete the nodes no run needs
        env:
          LATITUDE_API_KEY: ${{ secrets.LATITUDE_API_KEY }}
          LATITUDE_PROJECT: ${{ secrets.LATITUDE_PROJECT }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .series/platform/ci/src/scripts/ci/latitude_node.py sweep
