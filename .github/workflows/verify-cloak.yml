# ─────────────────────────────────────────────────────────────────────────────
# verify-cloak.yml — re-runnable CLOAK + WEBGL-MASKING GUARDS for an EXISTING
# build run's artifacts, WITHOUT rebuilding Firefox (~2h su una gamba).
#
# release.yml runs these same guards in its `gate` job against each freshly-built
# artifact. This re-runs them against the artifacts of a PRIOR build run (input
# `run_id`) using the CURRENT wrapper code on the default branch — so a test-only
# fix (e.g. making a leg tolerant of the runner's missing WebGL) can be validated
# against the real binaries in ~10 min instead of paying a full rebuild.
#
# Same guard command as release.yml's gate. Headed-but-cloaked; zero proxy / zero
# secrets.
#
# ⛔ Fino al 2026-08-26 questa intestazione diceva "The macOS legs are the only
# place the cocoa cloak patch actually RUNS". Era vero, e da quel giorno non lo
# e' piu': le gambe mac sono uscite, quindi il cloak cocoa NON viene piu'
# esercitato da nessuna parte. Non e' una perdita di copertura da recuperare -
# e' la conseguenza di aver smesso di spedire per mac - ma va detta invece che
# cancellata, perche' una riga sparita non insegna niente a chi la cerca.
# ─────────────────────────────────────────────────────────────────────────────
name: verify-cloak

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build run id whose asset-* artifacts to re-gate (e.g. 27346856197)'
        required: true
      wrapper_ref:
        description: >
          invisible_playwright ref the guards run from. Defaults to main, which
          is what release.yml validates against. Point it at a BRANCH to test a
          wrapper-side fix against real binaries without merging it first.
        required: false
        default: 'main'

permissions:
  contents: read
  actions: read   # download-artifact needs this to read another run's artifacts

jobs:
  guard:
    name: guard-${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Same legs/runners/assets as release.yml's gate matrix.
        include:
          # Le due gambe macOS sono uscite il 2026-08-26 (fine supporto totale,
          # decisione del proprietario). Nominavano anche macos-15 /
          # macos-15-intel, immagini gia' abbandonate a firefox-19: stale due
          # volte. Il mac resta LEGGIBILE dove serve alla storia - make_seal.py
          # tiene darwin in ENTRY_REL e in NAME_RE apposta, perche' i tag fino a
          # firefox-20 il mac ce l'avevano - ma qui si smette di pretenderlo.
          - leg: linux-x86_64
            runner: ubuntu-24.04
            kind: linux
            asset: firefox-151.0-stealth-linux-x86_64.tar.gz
          - leg: linux-arm64
            runner: ubuntu-24.04-arm
            kind: linux
            asset: firefox-151.0-stealth-linux-arm64.tar.gz
          - leg: win-x86_64
            runner: windows-latest
            kind: win
            asset: firefox-151.0-stealth-win-x86_64.zip
    steps:
      - name: Checkout wrapper (current default branch — the FIXED tests)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: feder-cr/invisible_playwright
          ref: ${{ github.event.inputs.wrapper_ref || 'main' }}
          fetch-depth: 1
      - name: Download build asset from the prior run (no rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: asset-${{ matrix.leg }}
          path: art
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install Playwright driver (no bundled browser — we override executable_path)
        # Single-source pin (see release.yml); the wrapper enforces juggler compat.
        shell: bash
        run: python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
      - name: Linux system deps for headless firefox
        if: matrix.kind == 'linux'
        run: sudo "$(which python)" -m playwright install-deps firefox
      - name: Extract + locate firefox binary
        shell: bash
        run: |
          set -e
          mkdir -p ff
          A="art/${{ matrix.asset }}"
          case "${{ matrix.kind }}" in
            win)   python -c "import zipfile; zipfile.ZipFile('$A').extractall('ff')"; EXE="ff/firefox.exe";;
            linux) tar xzf "$A" -C ff; EXE="ff/firefox";;
          esac
          [ -e "$EXE" ] || { echo "ERROR: firefox binary not found at $EXE"; exit 1; }
          chmod +x "$EXE" 2>/dev/null || true
          echo "FF_EXE=$EXE" >> "$GITHUB_ENV"
          echo "located: $EXE"
      - name: Cloak + WebGL-masking guards (headed)
        shell: bash
        run: |
          python -m pip install --quiet ".[dev]"
          # La chiave per il binario in prova, che qui non c'era: senza, ogni
          # gamba muore con EngineMismatch appena si ri-gattano artefatti di un
          # tag diverso da quello che il core impacchettato dichiara. Misurato
          # il 2026-08-30 sui tre legs di firefox-24: tre rossi che non dicevano
          # niente sul binario. release.yml lo faceva gia'.
          python -m invisible_core seal --binary "$FF_EXE" -o gate.seal.json
          INVISIBLE_SEAL_FILE="$PWD/gate.seal.json" INVPW_BINARY_PATH="$FF_EXE" python -m pytest \
            tests/test_cloak.py \
            "tests/test_fingerprint_surface.py::test_webgl_readpixels_no_masking_signature" \
            -m e2e -o addopts='' -q
