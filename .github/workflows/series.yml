# The engine series on every push: its own rules, then the proof that it applies to
# the Mozilla tag and gives exactly the tree it was exported as. No Firefox build
# here: release.yml builds it, from the same materialize step.
name: series
on:
  push:
    branches: [engine, main]
  pull_request:
    branches: [engine, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: The repo's tests
        run: python -m pytest -q tools/tests
      - name: The series' rules (folders, manifests, hook budgets, workflow copies)
        run: python tools/engine.py check

  rebuilds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: .series
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The Mozilla tag from Mozilla, the series applied, the declared tree
        run: python .series/tools/engine.py materialize --into source
