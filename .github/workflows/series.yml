# The engine series on every push: its own rules, then the proof that it applies to
# the Mozilla tag and gives exactly the tree it was exported as. No Firefox build
# here: release.yml builds it, from the same materialize step.
name: series
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: The repo's tests
        run: python -m pytest -q tools/tests
      - name: The series' rules (folders, manifests, hook budgets, workflow copies)
        run: python tools/engine.py check

  rebuilds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: .series
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The Mozilla tag from Mozilla, the series applied, the declared tree
        run: python .series/tools/engine.py materialize --into source
      # The core's checks that read the engine's source: pref types and readers,
      # prefs the binary reads, the Juggler contract and protocol, the WebGL
      # extension order, the font manifest. In the core's own CI they skip, as no
      # engine tree is there; here they read the tree this commit materializes,
      # on every push and on every port to a new Firefox tag. A skip fails the
      # step: it means a check did not read the tree.
      # The core is pinned by commit, like the actions: a core change cannot turn
      # this check red with no engine change. A port moves it to the core commit
      # made for that Firefox (today engine/firefox-159, which carries
      # STEALTH_FIREFOX_COMMIT and the WebGL lists of 159).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: feder-cr/invisible_core
          ref: e64b20f719a3e751e31af16a0c7d8abb5b9c3349
          path: core
          persist-credentials: false
      - run: pip install -e "./core[dev]"
      - name: The core's checks, against this tree
        working-directory: core
        shell: bash
        env:
          STEALTH_FIREFOX_SRC: ${{ github.workspace }}/source
        run: |
          # The full sha, not HEAD: the core strips "<commit>:" from git grep lines.
          export STEALTH_FIREFOX_COMMIT="$(git -C "$STEALTH_FIREFOX_SRC" rev-parse HEAD)"
          python -m pytest -q -rs --junitxml=../core-checks.xml \
            tests/test_pref_types.py tests/test_prefs_surface.py \
            tests/test_juggler_contract.py tests/test_juggler_protocol_mirror.py \
            tests/test_webgl_extensions_follow_the_engine.py
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("../core-checks.xml").getroot().iter("testsuite")
          counts = [(int(s.get("tests")), int(s.get("skipped"))) for s in suite]
          tests, skipped = sum(t for t, _ in counts), sum(s for _, s in counts)
          print("core checks: %d tests, %d skipped" % (tests, skipped))
          if not tests or skipped:
              print("::error::a core check skipped or none ran: it did not read this tree")
              sys.exit(1)
          EOF
