# ─────────────────────────────────────────────────────────────────────────────
# release.yml — build all 3 patched-Firefox targets (Win + Linux x2) at $0 and publish them as
# DRAFT GitHub Release assets, named per the wrapper contract (constants.ARCHIVE_NAME).
# DRAFT on purpose: a human runs the realness gate and only THEN un-drafts + bumps
# BINARY_VERSION. Nothing auto-ships (issue #14 lesson).
#
# PACKAGING (issue #14: dangling symlinks broke 265 downloads — never again):
#   Linux → cp -aL (dereference ALL symlinks into real files) + rm dev tools +
#           strip + sanitize + tar at ROOT, then validate_release.py as a HARD
#           in-pipeline gate (the exact battle-tested script from the source repo).
#   Win   → mach package; zip the CONTENTS of dist/firefox (clean tree, NOT
#           dist/bin) so firefox.exe sits at the zip ROOT.
#
# DRIVE GATE (the firefox-8 catcher): after build, every binary is DRIVEN by
# Playwright on its native runner (launch via juggler + real page + JS roundtrip,
# headless, no screenshot → GPU-free, zero proxy). A juggler-less binary renders
# a screenshot fine but is undrivable — only an actual drive catches that. The
# proxy realness gate (fppro/webrtc) stays LOCAL — it needs secrets.
#
# Trigger: by hand only, from main for a release (scripts/release_plan.py says why).
# A run by hand is a CANDIDATE (build + gate, nothing published, a green run)
# unless it says kind=release; the `plan` job decides, once, before any build
# (scripts/release_plan.py), and every job reads its outputs.
#
# WHO COMPILES: the two x86_64 legs on one Theta node, ONLY there, one after the
# other, each on a single-job runner with a label of its own. linux-arm64 on GitHub's
# runners, because the node is x86. Gates and tests stay on GitHub's runners, with the
# binaries from the artifacts. `node` turns the node on: if it cannot, the run fails.
# `watch-*` start the next leg's runner, and re-launch the run once if the machine is
# lost; `stop-node` turns it off. All on GitHub's runners with the API key, which never
# reaches the node (scripts/ci/theta_node.py, scripts/ci/test_release_builder.py).
# ─────────────────────────────────────────────────────────────────────────────
name: release
# A re-launch says so where the watch of the run it replaces can find it (theta_node.py).
run-name: ${{ inputs.relaunch_of != '' && format('release, relaunch of {0}', inputs.relaunch_of) || 'release' }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: >
          candidate: build and gate, publish nothing (no seal, no draft); its
          archives stay the run's artifacts, and republish.yml publishes them
          from its run id. release: also the seal and the DRAFT under
          release_tag.
        type: choice
        options: [candidate, release]
        default: candidate
      release_tag:
        description: 'firefox-N to publish the draft under; kind=release only, a candidate refuses one'
        required: false
        default: ''
      compile_cache:
        description: >
          gha: compile through sccache on the GitHub Actions cache, so a run after
          a fix recompiles only what changed (the plan's default). off: a cold
          build.
        type: choice
        options: ['gha', 'off']
        default: 'gha'
      wrapper_ref:
        description: >
          invisible_playwright ref the gate runs against. Defaults to main,
          which is what will be published next and therefore the right thing to
          validate a new binary with. Set it to a published TAG while the
          wrapper is mid-rewrite: otherwise unfinished work on main blocks a
          binary release that has nothing to do with it.
        default: 'main'
      core_ref:
        description: >
          invisible_core ref the gate installs. Defaults to main, for the reason
          the gate step gives. Set it to the branch that follows a change of the
          engine's layout (firefox-47 moved the juggler to modules/juggler):
          main still reads the old one and refuses every launch. The core is
          installed before the wrapper, so wrapper_ref must pin the version this
          ref builds. On stealth/157 it is engine/firefox-157 until that branch
          is merged: main's branding archives are 151's, and the page-surface
          gate refuses every leg built with them (aboutDialog.css differs from
          the retail's; run 40403680432, dispatched with the old default).
        default: 'engine/firefox-157'
      gtests:
        description: >
          Also run the engine's gtests on every leg, after its package and
          symbols. They link a second libxul with the same LTO and PGO, about an
          hour more a leg: off by default, for the CANDIDATE before a release. A
          cold release leg already fills most of the job's 350 minutes on Windows.
        type: boolean
        default: false
      gtest_filter:
        description: "gtests=true only: which, as mach gtest takes them (e.g. StartupCache.*:Stealth*); * is all"
        default: '*'
      relaunch_of:
        description: >
          Set by the watch of a run whose machine was lost, to that run's id: this run
          is its one re-launch, and losing the machine again fails it. Not for a run by hand.
        default: ''

# Each job asks for what it needs.
permissions: { contents: read }

# What gets built: this repository holds the patch series only. Every job that
# needs the engine's source rebuilds it with tools/engine.py materialize: the
# Mozilla tag named in UPSTREAM.json, fetched from Mozilla's repository, plus the
# series applied as one commit per folder (dated like the tag, so the commit is the
# same on every runner and on any machine that applies the same series).
jobs:
  # What this run is, decided once and before the builds: a release with a bad
  # tag is refused here in seconds, not at the seal two hours later, and a
  # candidate never reaches the seal at all.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      tag: ${{ steps.plan.outputs.tag }}
      num: ${{ steps.plan.outputs.num }}
      prevtag: ${{ steps.plan.outputs.prevtag }}
      seal_tag: ${{ steps.plan.outputs.seal_tag }}
      compile_cache: ${{ steps.plan.outputs.compile_cache }}
      build_date: ${{ steps.build_date.outputs.build_date }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        run: python3 .series/tools/engine.py materialize --into .
      - name: The plan refuses what it must
        run: python3 scripts/test_release_plan.py
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          KIND: ${{ inputs.kind }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMPILE_CACHE: ${{ inputs.compile_cache }}
        run: |
          set -e
          python3 scripts/release_plan.py --event "$EVENT" --kind "$KIND" \
            --release-tag "$RELEASE_TAG" --ref-name "$REF_NAME" \
            --compile-cache "$COMPILE_CACHE" --ref-type "$REF_TYPE" > plan.txt
          cat plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"
      # ONE BuildID for the whole run, as a retail release has one on every
      # platform: the build graph generates buildid.h more than once per build
      # from 157, and without MOZ_BUILD_DATE each generation takes the clock
      # (see the .mozconfig, which takes this value when it is set).
      - name: One build date for every leg
        id: build_date
        run: echo "build_date=$(date -u +%Y%m%d%H%M%S)" | tee -a "$GITHUB_OUTPUT"
      # The legs, from scripts/ci/legs.py: runners, targets, and the asset
      # names derived from the version the tree builds (never written here).
      - name: The legs and their asset names
        id: matrix
        run: |
          python3 scripts/ci/test_ci.py
          # The SDK downloader's hook: run 41205185526 idled 5 hours on a
          # download error the pool could not carry back.
          python3 scripts/ci/test_stealth_download_watchdog.py
          echo "matrix=$(python3 scripts/ci matrix)" | tee -a "$GITHUB_OUTPUT"

  # Turns the Theta node on for this run (scripts/ci/theta_node.py). If it cannot, this
  # job fails and with it the run: nothing else compiles the x86_64 legs.
  node:
    needs: plan
    runs-on: ubuntu-24.04
    environment: theta-builder
    timeout-minutes: 45
    permissions: { actions: read, contents: read }
    outputs:
      runner: ${{ steps.node.outputs.runner }}
      attempt: ${{ steps.node.outputs.attempt }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: Turn the node on, prepare it, start the first leg's runner
        id: node
        # `shell: bash` is what adds pipefail: without it a crash behind this `tee`
        # would pass for a job that worked and said nothing.
        shell: bash
        env:
          THETA_API_KEY: ${{ secrets.THETA_API_KEY }}
          THETA_PROJECT: ${{ secrets.THETA_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/theta_node.py provision \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --access-out node-access.enc | tee -a "$GITHUB_OUTPUT"
      # The node's SSH key for the watch, which starts the next leg's runner. Encrypted
      # with what only a job holding the API key can derive: artifacts here are public.
      - name: Keep the node's access for the watch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-access-${{ github.run_attempt }}
          path: node-access.enc
          if-no-files-found: error
          retention-days: 1

  build:
    name: build-${{ matrix.leg }}
    needs: [plan, node]
    # The label of this run and attempt, one per leg, or the matrix's own runner for
    # linux-arm64. An x86_64 leg names no runner (scripts/ci/legs.py), so there is
    # nothing else for it to run on. A rerun of failed jobs reuses this job's outputs
    # with a node already deleted: empty, and GitHub refuses the job at once.
    runs-on: ${{ matrix.runner || (needs.node.outputs.attempt == github.run_attempt && format('{0}-{1}', needs.node.outputs.runner, matrix.leg)) || '' }}
    timeout-minutes: 350
    # What the job's token may do, on a node a stranger owns: read this repository.
    permissions: { contents: read }
    env:
      MOZ_BUILD_DATE: ${{ needs.plan.outputs.build_date }}
      # Every event scripts/ci/phase.py records is this leg's.
      CI_LEG: ${{ matrix.leg }}
      # Every inherited CARGO_* variable enters sccache's key for Rust. Stated here, as
      # GitHub's images state it, so that the node's first run finds their entries.
      CARGO_HOME: /home/runner/.cargo
    strategy:
      fail-fast: false
      # The legs are data in scripts/ci/legs.py (runner, host, target, asset
      # name), computed once by the plan job: the asset names used to be
      # written here by hand, one per entry, with the version in each.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # apt has no network timeout of its own: in run 41248997155 `apt-get
      # update` waited on archive.ubuntu.com for 5h40, until the job's limit,
      # and the leg was lost. Every apt-get of this job reads this file, so a
      # stalled mirror fails in minutes and a busy one is asked again.
      - name: apt - network timeouts and retries
        run: |
          printf '%s\n' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' 'Acquire::Retries "5";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
      - name: Free disk + 32G swap (Linux runners)
        # The node has 700 GB free, and a container cannot have swap.
        if: runner.environment == 'github-hosted'
        run: |
          # The GH-hosted 14GB-free disk is tight for a full Firefox build: objdir
          # (.o + libxul) + `mach package` (a second dist copy) + the archive, plus
          # 16G of swap and, on the win-cross leg, the fetched MSVC toolchain. The
          # first firefox-18 win leg packaged fine and the second died on
          # `No space left on device` at packaging time - i.e. marginal, not broken.
          # Reclaim the big preinstalled caches up front so it stops being marginal.
          # Everything here is best-effort (|| true) - a missing path must never fail
          # the build.
          echo "disk before cleanup:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "disk after cleanup:"; df -h / | tail -1
          # ⛔ The runner image ships its own /swapfile (3 GB, already on), and
          # `fallocate` on it fails with "Text file busy". The `|| true` that was
          # here hid it, every build ran with 3 GB of swap, and the first build
          # with debug symbols was shut down out of memory (run 40441908109:
          # 11.4 of 16 GB used and climbing, then "The runner has received a
          # shutdown signal"). The image's swap goes off first, and fewer than
          # 16 GB fails the step instead of letting the build find out.
          # 24 GB since full LTO (2026-10-27): ld.lld linking libxul.so alone
          # passed 14 GB resident (run 40500378511), on a 16 GB runner. 32 GB
          # since the Windows leg's link used 24.4 of those 24 (run
          # 40520853142), with 56 GB of disk still free at its lowest.
          # Compressed swap in RAM first (2026-10-30). The full-LTO link lives in
          # swap: in run 40965451707 the Windows link held 14.5 GB resident and
          # 24 GB in swap and took 78 min, 55 min on 2026-10-28 for the same link,
          # so the disk under the swap decides. zram (zstd, priority 100) keeps the
          # pages compressed in memory, and reading one back costs CPU, not disk.
          # When it is full the kernel goes on to the swap file (priority 10), on
          # the runner's temporary disk /mnt when it has room, which also leaves /
          # to the objdir. The binary does not change: only where pages wait.
          sudo swapoff -a
          sudo rm -f /swapfile
          # 28G: the Windows link needs ~26 GB of swap and its pages compress ~4:1
          # (run 41013087933: link 45 min, against 57 at 16G and 78 on the disk).
          # A runner whose free device is taken (run 41325666566: "zramctl:
          # /dev/zram0: failed to reset: Device or resource busy") gets a new one
          # from hot_add; one where neither works degrades like a runner without
          # the module, a warning and the disk file alone, never a lost leg.
          zram_swap() {
            ZRAM="$(sudo zramctl --find --size 28G --algorithm zstd)" || {
              N="$(sudo cat /sys/class/zram-control/hot_add)" &&
                sudo zramctl --size 28G --algorithm zstd "/dev/zram$N" && ZRAM="/dev/zram$N"
            } || return 1
            echo 10G | sudo tee "/sys/block/${ZRAM#/dev/}/mem_limit" >/dev/null &&
              sudo mkswap "$ZRAM" >/dev/null && sudo swapon -p 100 "$ZRAM"
          }
          if { sudo modprobe zram 2>/dev/null || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 && sudo modprobe zram; }; } && zram_swap; then
            sudo sysctl -q vm.page-cluster=0
            echo "swap: zram $ZRAM, 28G of pages in at most 10 GB of memory, first" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no usable zram on this runner: the swap is the disk file alone"
            echo "swap: NO usable zram on this runner, the disk file alone" >> "$GITHUB_STEP_SUMMARY"
          fi
          SWAPFILE=/swapfile
          if [ -d /mnt ] && [ "$(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9)" -ge 40 ]; then
            SWAPFILE=/mnt/swapfile
          fi
          sudo fallocate -l 32G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE" >/dev/null
          sudo swapon -p 10 "$SWAPFILE"
          echo "swap file: $SWAPFILE" | tee -a "$GITHUB_STEP_SUMMARY"
          cat /proc/swaps
          FILE_MB="$(awk -v f="$SWAPFILE" '$1==f{print int($3/1024)}' /proc/swaps)"
          [ "${FILE_MB:-0}" -ge 32000 ] || { echo "ERROR: only ${FILE_MB:-0} MB of swap file"; exit 1; }

      - name: Python for the series tool
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        run: python .series/tools/engine.py materialize --into .

      # Cheapest gate in the pipeline, guarding the most expensive failure: the asset
      # basename is hand-written in every matrix entry below and derived independently
      # on the client side. When the two disagree CI publishes one name while the
      # wrapper fetches another, so every download 404s while the build is green, the
      # archives are valid and the release page looks correct (issue #14). Fail here in
      # seconds instead of after five multi-hour builds.
      - name: Check asset names match the version this tree builds
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        run: python3 scripts/check_release_naming.py

      # The source the official build states (browser/config/upstream_source.txt,
      # read by the .mozconfig) must be the retail's of the version this tree
      # builds; a port that moves the base and leaves the file behind would
      # write the previous release's changeset into application.ini. Seconds,
      # here, before the build; --online also asks Mozilla's build record.
      - name: Check the declared upstream source matches the version this tree builds
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        run: python3 scripts/check_upstream_source.py --online

      # Juggler tested without a browser, seconds here before hours of build.
      # The channel between its two halves: a request answered from another
      # channel end's kept answers is never dispatched and nothing says so (a
      # page's "main world created" was lost that way, B286). And where it loads
      # from: never a chrome package, which a page probes by name, and every
      # resource URL a file the build installs (invisible_playwright #336).
      - name: Juggler's tests without a browser
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        # The files, expanded by the shell: from Node 21 the arguments of
        # --test are file patterns, and a directory is loaded as a module.
        run: node --test juggler/tests/*.test.mjs

      # The release scripts' own known-bad inputs: validate_release.py's
      # retail-updater and no-juggler-name checks, and make_seal.py's refusals. A
      # check that has only ever printed its OK line is not a gate.
      - name: The release scripts refuse what they must
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        run: |
          python3 scripts/validate_release.py --selftest
          python3 scripts/test_make_seal.py
          python3 scripts/test_check_upstream_source.py
          python3 scripts/test_toolchain_parity.py
          python3 scripts/test_upstream_toolchain.py
          python3 scripts/test_memory_watch.py
          python3 scripts/test_cpu_watch.py
          python3 scripts/test_workflow_cache_rules.py

      # Record what this build came from: source-commit.txt is the engine commit (the
      # tag plus the series applied, reproducible with tools/engine.py apply) that the
      # seal names; series-commit.txt is the commit of this repository, the series.
      # The publish job turns previous-release..this series commit into the release
      # notes (scripts/gen_release_notes.py) and re-publishes both files as assets, so
      # the NEXT release knows where to start the changelog. One leg is enough: every
      # leg applies the same series to the same tag.
      - name: Record source commit (for auto release notes)
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        run: |
          git rev-parse HEAD > source-commit.txt && cat source-commit.txt
          git -C .series rev-parse HEAD > series-commit.txt && cat series-commit.txt
      - name: Upload source-commit artifact
        if: matrix.leg == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-commit
          path: |
            source-commit.txt
            series-commit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }

      # The page-surface gate at the packaging step asks invisible_core which
      # branding archive it declares (validate_release.declared_branding): an
      # engine with the branding redirect (P60) serves that archive, not the
      # brand in its omni.ja, so that archive is what a page reads and what is
      # judged. The core is the one the drive gate pairs with the binary,
      # core_ref, so both gates judge the same pairing. An engine without the
      # redirect never asks, and the install stays unconditional on purpose:
      # every engine built from a tree with P60 redirects, so a conditional
      # would only be a second place deciding what serves_declared_branding
      # already decides from the tree, and a core_ref that cannot install
      # fails the drive gate of the same run.
      #
      # BEFORE the build, and the question asked once here: the core's answer
      # does not depend on the build. It used to be installed after `mach
      # build`, so a core whose contract had moved was found at the packaging
      # step, two hours in: every leg of the first firefox-50 candidate died
      # there, because core 49.46.0 refuses a profile translated without a
      # session zone and the gate did not pass one.
      - name: Install the invisible_core the page-surface gate asks for its branding
        run: |
          python3 -m pip install --quiet \
            "git+https://github.com/feder-cr/invisible_core@${{ github.event.inputs.core_ref || 'main' }}"
          python3 -c "from importlib.metadata import version; print('core asked for the branding:', version('invisible-core'))"
          ( cd scripts && python3 -c "import validate_release; print('branding it declares:', validate_release.declared_branding())" )

      - name: Install Linux build tools
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux binutils ${{ matrix.extra_pkgs }}

      # The toolchains in an entry of their own, by their versions, on the x86_64
      # legs wherever they run: ~/.mozbuild (clang, the MSVC of the win leg, what
      # --enable-bootstrap fetches) and the retail's Rust. The CDNs have stopped us
      # twice (runs 41205185526, 41302586484), and the node starts empty every time.
      - name: Toolchains - their versions
        id: toolchains-key
        if: matrix.node
        shell: bash
        run: |
          RUST="$(python3 scripts/upstream_toolchain.py --leg ${{ matrix.leg }} rust-version)"
          echo "rust=$RUST" >> "$GITHUB_OUTPUT"
          echo "key=toolchains-${{ matrix.leg }}-rust$RUST-${{ hashFiles('taskcluster/kinds/toolchain/*.yml', 'build/vs/*.yaml', 'build/moz.configure/bootstrap.configure') }}" | tee -a "$GITHUB_OUTPUT"
      - name: Toolchains - restore
        id: toolchains
        if: matrix.node
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.mozbuild
            !~/.mozbuild/srcdirs
            ~/.rustup/toolchains/${{ steps.toolchains-key.outputs.rust }}-x86_64-unknown-linux-gnu
          key: ${{ steps.toolchains-key.outputs.key }}

      # The retail's Rust, not the runner's. --enable-bootstrap fetches clang
      # from Mozilla but takes Rust from PATH, and the runner's "stable" built
      # the 157 candidates with rustc 1.99.0 against the retail's 1.95.0 - and
      # would have moved by itself next month. The release is the one the
      # retail build of upstream_source.txt's changeset fetched
      # (scripts/upstream_toolchain.py), so a new Firefox brings its own.
      # scripts/toolchain_parity.py compares the result after the build.
      - name: Rust, the retail's release for this tree
        run: |
          RUST="$(python3 scripts/upstream_toolchain.py --leg ${{ matrix.leg }} rust-version)"
          rustup toolchain install "$RUST" --profile minimal --target ${{ matrix.rust_target }}
          rustup default "$RUST"
          rustc --version

      # LA CACHE DI COMPILAZIONE (compile_cache=gha, deciso da
      # scripts/release_plan.py). La corsa dopo una correzione deve ricompilare
      # solo cio' che la correzione tocca: un port a una nuova versione di
      # Firefox richiede molte corse, e ognuna a freddo costa 1-2 ore a gamba.
      #
      # COME: sccache con la cache su DISCO del runner (SCCACHE_DIR), e quella
      # cartella salvata e ripristinata da actions/cache come UNA voce per gamba.
      #
      # ⛔ NON il backend `gha` di sccache (SCCACHE_GHA_ENABLED), che e' come
      # questa cache e' nata il 2026-10-26 ed e' stato misurato sbagliato: crea
      # una voce di cache PER OGNI OGGETTO compilato, circa 5.500 a gamba, e
      # GitHub accetta 200 nuove voci al minuto per repository (1.500 letture);
      # oltre, l'upload fallisce e sccache prosegue in silenzio. Risultato: il
      # 33-48% delle scritture perso nella corsa fredda e il 100% in una corsa
      # calda su Windows (corse 40302089863, 40318828530), e quello che non si
      # scrive torna miss alla corsa dopo. Una voce per gamba per corsa sta
      # lontanissima da quel tetto.
      #
      # ⛔ E UN SOLO sccache, quello fissato qui, passato a configure col
      # percorso ASSOLUTO. Con `--with-ccache=sccache` (il nome nudo del
      # .mozconfig) e --enable-bootstrap, mach scarica un sccache SUO in
      # ~/.mozbuild/sccache e configure prende quello: nelle stesse corse le
      # gambe x86_64 e Windows compilavano con lo 0.17.0 di Mozilla, la arm64
      # (dove il bootstrap non ne fornisce uno) con lo 0.18.0 fissato qui. Il
      # passo dopo la build fallisce se il compilatore non e' passato da questo.
      #
      # La chiave e' per gamba e unica per corsa (le voci della cache sono
      # immutabili); si riparte dall'ultima della stessa gamba. Le chiavi di
      # sccache dentro la cartella sono l'hash di sorgente preprocessato,
      # argomenti e compilatore, quindi un oggetto riusato e' identico a quello
      # che la compilazione produrrebbe. Il tetto del repository e' 150 GB dal
      # 2026-10-28 (10 fino al 27, poi 60). Con PGO + LTO + simboli una build
      # scrive PIU' di 15 GB di oggetti: sccache sfratta i piu' vecchi per
      # restare nel tetto, la build dopo compila nello stesso ordine, trova
      # sfrattati i primi e scrivendoli sfratta quelli che le servirebbero
      # dopo - la corsa 40557157874 riuso' lo 0.2% (prima di PGO il 98.5%).
      # 30 GB a gamba, 90 in tutto: ci stanno, con la generazione precedente
      # di ogni gamba, che e' la meno usata di recente e va via per prima.
      #
      # Versioni fissate, non "latest": una build che cambia strumento da sola
      # tra una corsa e l'altra non e' riproducibile.
      #
      # Built from its tag and our patches (scripts/ci/sccache_build.py), never
      # downloaded: 0.18.0 counts the file of a Rust -C profile-use among the
      # compile's outputs and wrote the PGO profile back on every cache hit, and
      # the new mtime made the symbols step rebuild gkrust and relink xul (run
      # 40630019710). The binary is cached by tag and patches.
      - name: Compile cache - the sccache binary, if built before
        if: needs.plan.outputs.compile_cache == 'gha'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-bin
          # The node is Ubuntu 22.04 and a binary built on 24.04 wants a newer glibc: its
          # own entry. Compile hits do not depend on it: neither sccache's version nor
          # its path enters their key. No key here is one the arm64 leg reads
          # (test_release_builder.py), so nothing the node writes runs on GitHub's runners.
          key: sccache-bin-${{ runner.os }}-${{ runner.arch }}${{ runner.environment == 'github-hosted' && '' || '-node' }}-v0.18.0-${{ hashFiles('scripts/ci/sccache/*.patch') }}
      - name: Compile cache - build the one sccache this build uses
        if: needs.plan.outputs.compile_cache == 'gha'
        shell: bash
        run: |
          SCCACHE_PATH="$(python3 scripts/ci sccache-build --tag v0.18.0 --patches scripts/ci/sccache --out "$HOME/.cache/sccache-bin")"
          "$SCCACHE_PATH" --version
          echo "SCCACHE_PATH=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - name: Compile cache - sccache keeps it on the runner's disk
        if: needs.plan.outputs.compile_cache == 'gha'
        run: |
          {
            echo "SCCACHE_DIR=$HOME/.cache/sccache-ci"
            echo "SCCACHE_CACHE_SIZE=30G"
            echo "SCCACHE_PINNED_VERSION=0.18.0"
            # Never idle out: the full-LTO link runs for longer than the default
            # ten minutes with nothing to compile, the server exited, and the
            # statistics step read a fresh server's zeros (run 40593659072).
            echo "SCCACHE_IDLE_TIMEOUT=0"
            # For the node's first runs: which objects miss on every run, by name
            # (about 55 on Linux). Only their names are kept, see the step after the stats.
            if [ "${{ matrix.node }}" = "true" ]; then
              echo "SCCACHE_LOG=debug"
              echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-debug.log"
            fi
          } >> "$GITHUB_ENV"
      - name: Compile cache - restore this leg's last one
        id: cache-restore
        if: needs.plan.outputs.compile_cache == 'gha'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ matrix.leg }}-
      # Once more when the first restore brought nothing. In run 40647970370
      # the download was cut off two minutes in on linux-arm64 and
      # win-x86_64 ("Failed to restore: The operation was aborted"), the step
      # only warned, and both legs built cold without a word: 0.06% and 1.6%
      # hits, the Windows build 2h39 against 1h50. A leg that has no cache
      # yet misses twice, which costs seconds.
      - name: Compile cache - restore again if the first brought nothing
        id: cache-restore-again
        if: needs.plan.outputs.compile_cache == 'gha' && steps.cache-restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ matrix.leg }}-
      # What this build starts from, said where it is read: a cold candidate is
      # a fact of the run, not something to infer from its length.
      - name: Compile cache - what this build starts from
        if: needs.plan.outputs.compile_cache == 'gha'
        shell: bash
        env:
          FIRST: ${{ steps.cache-restore.outputs.cache-matched-key }}
          AGAIN: ${{ steps.cache-restore-again.outputs.cache-matched-key }}
        run: |
          FROM="${FIRST:-$AGAIN}"
          if [ -n "$FROM" ]; then
            echo "compile cache: ${{ matrix.leg }} starts from $FROM" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::compile cache: ${{ matrix.leg }} restored nothing and builds cold"
            echo "compile cache: ${{ matrix.leg }} restored NOTHING, this build is cold" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The .mozconfig in layers (scripts/ci/mozconfig.py): compile cache,
      # symbols, the retail's PGO and LTO, platform, machine. Each layer writes
      # its reason into the file, and the flags are fixed by scripts/ci/test_ci.py.
      - name: The node - compile jobs from its limits
        if: runner.environment != 'github-hosted'
        run: |
          PARALLEL="$(python3 scripts/ci node-parallel)"
          [ "$PARALLEL" -ge 1 ] || { echo "ERROR: no compile jobs from the node's limits: '$PARALLEL'"; exit 1; }
          echo "CI_PARALLEL=$PARALLEL" | tee -a "$GITHUB_ENV"
      - name: The CI's .mozconfig, in layers
        env:
          COMPILE_CACHE: ${{ needs.plan.outputs.compile_cache }}
        run: |
          rm -f mozconfig
          if [ "$COMPILE_CACHE" = "gha" ]; then
            test -x "$SCCACHE_PATH" || { echo "ERROR: no sccache at SCCACHE_PATH=$SCCACHE_PATH"; exit 1; }
          fi
          python3 scripts/ci mozconfig --leg "$CI_LEG" --compile-cache "$COMPILE_CACHE"

      - name: Build
        id: build
        # ⛔ Un tetto sul PASSO, non solo sul job. Il 2026-08-26 la gamba
        # win-x86_64 si e' piantata sul download del toolchain Microsoft che
        # `--enable-bootstrap` fa a inizio build: nessuna riga emessa per oltre
        # tre ore, con il contatore di mach fermo a 0:29. Senza questo tetto la
        # corsa avrebbe consumato le 6 ore del job prima di arrendersi, e il
        # guasto si riconosce solo aprendo il log e notando che il contatore non
        # si muove - cioe' a mano.
        # 180 minuti sono il 48% sopra la piu' lenta build riuscita mai
        # osservata su questa gamba (121 min il 2026-08-26; 105 e 106 il
        # 2026-08-17), quindi non uccide una build lenta ma vera. Quando scatta,
        # il job risulta FALLITO invece che appeso, e `rerun-failed-jobs`
        # ricompila la sola gamba caduta riusando gli artefatti delle altre.
        #
        # --keep-going: una corsa che fallisce riporta TUTTI gli errori di
        # compilazione della gamba, non solo i primi. Senza, make si ferma al
        # primo e ogni corsa da 1-2 ore ne mostra uno o due, che e' il modo piu'
        # lento di portare la pila su una versione nuova. Su una build che
        # riesce non cambia niente.
        # The disk too: the Windows leg of run 40466778026 stopped logging after
        # 86 of its 175 minutes with memory at 3 of 16 GB, and the runner never
        # answered again - the pattern of a full disk, which the next run will
        # show or rule out.
        # 300 since PGO + full LTO (2026-10-27): the first Windows leg with
        # them compiled for 156 minutes before its link, cold; the job's own
        # limit (350) stays above it.
        timeout-minutes: 300
        # Memory, swap and disk (memory_watch.py): a leg that runs out of memory goes
        # silent and is terminated without a word (run 40437686466), and these
        # lines are what tells that apart from a hang. The whole output also
        # goes to logs/build.log, uploaded when the build fails: the Windows leg of
        # run 40446702889 failed after its log stream had stopped, and no
        # line of the failure was left to read.
        run: |
          # Sampling every two minutes missed the burst that froze the Windows
          # legs of runs 40446702889 and 40466778026 (3 of 16 GB in the last
          # sample, then nothing): memory_watch.py samples every 5 seconds,
          # names the largest processes when memory runs low, and kills the
          # largest non-runner process before the machine freezes.
          # The phase records its events and, failing, puts its first error
          # lines and the watch's kills in the step summary (scripts/ci/phase.py);
          # its whole output goes to logs/build.log.
          python3 -u scripts/memory_watch.py --log memwatch.log &
          # The PGO profile is an input and nothing may move it (scripts/ci/input_watch.py):
          # run 40619608072 found its mtime 18 minutes into this step, and cargo
          # rebuilt gkrust for it in the symbols step.
          PROFILE="$HOME/pgo/merged.profdata"
          if [ -f "$PROFILE" ]; then python3 scripts/ci input-watch --file "$PROFILE" --log inputwatch.log & fi
          python3 scripts/ci phase build -- ./mach build --keep-going
          if [ -f "$PROFILE" ]; then python3 scripts/ci input-watch --file "$PROFILE" --log inputwatch.log --verify --strict; fi
      # What enters the compile's key and can move by itself: two runs that miss for no
      # reason differ here (scripts/ci/cache_rules.py).
      - name: Compile cache - what its key depends on
        if: always() && steps.build.outcome != 'skipped'
        run: python3 scripts/ci/cache_rules.py guard | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Swap - what the build left in zram and in the file
        if: always()
        run: |
          # How much of the link went to zram, how well it compressed, and whether
          # the file was reached: the numbers that say if the compressed swap paid.
          cat /proc/swaps
          sudo zramctl --output-all 2>/dev/null || true
      - name: Upload the logs of a failed build
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildlog-${{ matrix.leg }}
          path: |
            logs/
            memwatch.log
          if-no-files-found: ignore
          retention-days: 14

      # The compile cache's own gate: the build compiled through the sccache
      # pinned above, nothing else, and every object it compiled was stored.
      # Statistics first, so a refusal still shows them; then the server stops,
      # which flushes the cache directory before it is saved.
      - name: Compile cache - the build used the pinned sccache
        if: always() && needs.plan.outputs.compile_cache == 'gha'
        run: |
          "$SCCACHE_PATH" --show-stats | tee sccache-stats.txt || true
          STATS="$(cat sccache-stats.txt)"
          "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
          # configure.py writes the substs as JSON beside config.status.
          CONFIGURED="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["substs"].get("CCACHE", ""))' obj-rel/config.status.json 2>/dev/null || true)"
          echo "configure took CCACHE=${CONFIGURED:-<none>}"
          if [ "$CONFIGURED" != "$SCCACHE_PATH" ]; then
            echo "ERROR: configure did not take SCCACHE_PATH=$SCCACHE_PATH"
            exit 1
          fi
          SERVER="$(echo "$STATS" | sed -n 's/^Version (client) *//p')"
          if [ -n "$SERVER" ] && [ "$SERVER" != "$SCCACHE_PINNED_VERSION" ]; then
            echo "ERROR: the sccache server that compiled is $SERVER, pinned is $SCCACHE_PINNED_VERSION"
            exit 1
          fi
          WRITE_ERRORS="$(echo "$STATS" | sed -n 's/^Cache write errors *//p')"
          if [ "${WRITE_ERRORS:-0}" != "0" ]; then
            echo "::warning::sccache failed to store $WRITE_ERRORS objects: the next run recompiles them"
          fi
      - name: Compile cache - which objects missed, by name
        if: always() && matrix.node && needs.plan.outputs.compile_cache == 'gha'
        run: |
          grep -F 'Cache miss in' "$SCCACHE_ERROR_LOG" > sccache-misses.txt || true
          echo "compile cache: $(wc -l < sccache-misses.txt) objects missed, by name in this leg's events artifact" | tee -a "$GITHUB_STEP_SUMMARY"
      # The node uploads at about 5 MB/s: 15 minutes for an entry. A build that wrote
      # few new objects leaves the last entry as it is (scripts/ci/cache_rules.py).
      - name: Compile cache - is the node's upload worth it
        id: cache-worth
        if: always() && needs.plan.outputs.compile_cache == 'gha' && runner.environment != 'github-hosted'
        run: python3 scripts/ci/cache_rules.py worth --stats sccache-stats.txt | tee -a "$GITHUB_OUTPUT"
      - name: Compile cache - save this leg's
        # Also when the build failed: the runs that fix a port fail by design,
        # and they are the ones the cache is for.
        # Never when the build did not start: run 40519477694, cancelled during
        # checkout, saved an empty arm64 entry, and the next run would have
        # restored that one - the newest of its leg - and compiled cold.
        if: always() && needs.plan.outputs.compile_cache == 'gha' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled') && steps.cache-worth.outputs.save != 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache-ci
          key: sccache-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Only after a build that worked: a download cut off half way must not become
      # the entry every later run starts from.
      - name: Toolchains - save
        if: always() && matrix.node && steps.build.outcome == 'success' && steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.mozbuild
            !~/.mozbuild/srcdirs
            ~/.rustup/toolchains/${{ steps.toolchains-key.outputs.rust }}-x86_64-unknown-linux-gnu
          key: ${{ steps.toolchains-key.outputs.key }}

      # WebGPU's Vulkan driver on Linux is ours (scripts/ci/lavapipe_build.py):
      # without one requestAdapter() answered null, and with the host's Mesa its
      # version decided limits and raster bytes. Built from pinned sources and
      # our patches with this build's clang and sysroot, into dist/bin before
      # the gtests and the package; it is kept by its inputs, unless the run asks
      # for a cold build. x86_64 only: arm64 is not a priority, and without the
      # file WebGPU answers null there, never with a host driver.
      - name: WebGPU's Vulkan driver (linux-x86_64) - its inputs
        id: lavapipe-key
        if: matrix.leg == 'linux-x86_64'
        run: echo "key=lavapipe-${{ matrix.leg }}-$(python3 scripts/ci/lavapipe_build.py --key)" >> "$GITHUB_OUTPUT"
      - name: WebGPU's Vulkan driver (linux-x86_64) - built before
        id: lavapipe-cache
        if: matrix.leg == 'linux-x86_64' && needs.plan.outputs.compile_cache == 'gha'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lavapipe
          key: ${{ steps.lavapipe-key.outputs.key }}
      - name: WebGPU's Vulkan driver (linux-x86_64) - build
        id: lavapipe
        if: matrix.leg == 'linux-x86_64'
        # LLVM and Mesa cold: about an hour; a cache hit is seconds.
        timeout-minutes: 150
        run: |
          sudo apt-get install -y cmake ninja-build glslang-tools bison flex patchelf
          python3 scripts/ci phase lavapipe -- python3 scripts/ci/lavapipe_build.py --out "$HOME/.cache/lavapipe"
          mkdir -p obj-rel/dist/bin/lavapipe
          cp "$HOME/.cache/lavapipe/libvulkan_lvp.so" "$HOME/.cache/lavapipe/VERSION.json" obj-rel/dist/bin/lavapipe/
          cat obj-rel/dist/bin/lavapipe/VERSION.json
      - name: WebGPU's Vulkan driver (linux-x86_64) - keep it
        if: matrix.leg == 'linux-x86_64' && needs.plan.outputs.compile_cache == 'gha' && steps.lavapipe.outcome == 'success' && steps.lavapipe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lavapipe
          key: ${{ steps.lavapipe-key.outputs.key }}

      # Packaging per family (scripts/ci/package_linux.sh, package_win.sh):
      # the same gates, the archive layout each platform ships.
      - name: Package + validate
        env:
          ASSET: ${{ matrix.asset }}
        run: python3 scripts/ci phase package -- bash scripts/ci/package_${{ matrix.family }}.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-${{ matrix.leg }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

      # What this build was compiled with, complete: every configure value
      # (compilers, CFLAGS/CXXFLAGS/LDFLAGS, optimisation, LTO, PGO, Rust flags)
      # and every define, as configure wrote them. Until 2026-10-27 the objdir
      # was thrown away with the runner and the answer to "which flags does the
      # engine ship with" had to be pieced together from the mozconfig.
      - name: Build configuration
        run: |
          set -e
          mkdir -p buildconfig
          python3 - obj-rel/config.status.json buildconfig/build-config-${{ matrix.leg }}.json <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          out = {"substs": status.get("substs", {}), "defines": status.get("defines", {})}
          json.dump(out, open(sys.argv[2], "w"), indent=1, sort_keys=True)
          for key in sorted(out["substs"]):
              if any(t in key for t in ("FLAGS", "OPTIM", "LTO", "PGO", "RUST", "CC_VERSION", "CXX_VERSION")) or key in ("CC", "CXX", "LINKER_KIND"):
                  print("%s = %s" % (key, out["substs"][key]))
          PY
      - name: Upload build configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildconfig-${{ matrix.leg }}
          path: buildconfig/*.json
          if-no-files-found: error
          retention-days: 90

      # Crash dumps of this build turn into file:line only with its symbols, and
      # until 2026-10-27 no build had any: a content-process crash at shutdown on
      # the 157 candidates was a list of offsets in xul.dll. The archive is a
      # separate artifact, never part of the asset (gate.yml and publish.yml take
      # asset-* only).
      - name: Crash symbols (never shipped)
        # A ceiling of its own: in run 40593659072 this step recompiled Rust
        # (621 crates, 35 minutes against 2 the run before) and nothing bounded
        # it below the job's 350.
        timeout-minutes: 60
        env:
          # Why cargo finds a crate dirty here, in the log: the build had just
          # compiled it (run 40593659072), so something between the two steps
          # changed its fingerprint.
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          set -e
          python3 scripts/ci phase symbols -- ./mach buildsymbols
          mkdir -p symbols
          mv obj-rel/dist/*.crashreporter-symbols.zip symbols/
          ls -la symbols/
      - name: The crash symbols describe the shipped binaries
        # Run 40593659072 uploaded symbols for a xul.dll it did not ship: its
        # symbols step relinked xul after the package was made, and the archive
        # named 3E2BB500 for a binary that shipped as 030D79D8. Nothing said so;
        # a crash report from that build could never have been read.
        shell: bash
        run: python3 scripts/ci symbols-match --package "out/${{ matrix.asset }}" --symbols symbols/*.zip
      - name: Upload crash symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-${{ matrix.leg }}
          path: symbols/*.zip
          if-no-files-found: error
          retention-days: 14

      # The engine's own tests, on request (input gtests): the stealth hooks each
      # have one (StartupCache.WritesNeverLowerIOPriority, the bundled-font and
      # own-binary rules) and nothing else runs them. After the package and the
      # symbols, so what ships is already built and checked when the second
      # libxul is linked. A phase, so the report has its row.
      - name: Engine gtests (gtests=true only)
        if: github.event.inputs.gtests == 'true' && runner.environment == 'github-hosted'
        timeout-minutes: 180
        shell: bash
        env:
          GTEST_FILTER_INPUT: ${{ github.event.inputs.gtest_filter || '*' }}
        run: |
          # The Linux runners have no display, and some gtests open windows.
          sudo apt-get install -y xvfb >/dev/null
          python3 scripts/ci phase gtest -- xvfb-run -a ./mach gtest "$GTEST_FILTER_INPUT"
      # The node only compiles, on both legs: a hosted job runs what it built.
      - name: The node - its gtest binaries, for a job on GitHub's runners
        if: github.event.inputs.gtests == 'true' && runner.environment != 'github-hosted'
        timeout-minutes: 180
        shell: bash
        run: |
          python3 scripts/ci phase gtest -- ./mach build recurse_gtest
          tar -C obj-rel/dist -chf gtest-bin.tar bin
      - name: The node - keep them
        if: github.event.inputs.gtests == 'true' && runner.environment != 'github-hosted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gtest-bin-${{ matrix.leg }}
          path: gtest-bin.tar
          if-no-files-found: error
          retention-days: 3
      # Whether the build used the CPU well, phase by phase (scripts/cpu_watch.py). At
      # most a warning, so it can never cost a build what it has already done.
      - name: CPU use, by phase
        if: always() && matrix.node
        continue-on-error: true
        run: python3 scripts/ci cpu-report
      # This leg's events for the run's summary (the report job): always, a
      # failed or cancelled leg's most of all.
      - name: Upload this leg's events
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: events-${{ matrix.leg }}
          path: |
            events.jsonl
            memwatch.log
            sccache-stats.txt
            sccache-misses.txt
            cpuwatch.jsonl
            inputwatch*
          if-no-files-found: ignore
          retention-days: 14

  # The Windows leg's gtests, run where its binary runs. Its build job compiled them
  # on the node; here they run as `mach gtest` runs them on Windows:
  # firefox.exe -unittest from dist/bin, with MOZ_RUN_GTEST and the filter.
  gtest-cross:
    name: gtest-win-x86_64
    needs: build
    if: github.event.inputs.gtests == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: The leg's dist/bin with its gtest libxul
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gtest-bin-win-x86_64
          path: gtest-run
      - name: Engine gtests (gtests=true only)
        shell: bash
        env:
          GTEST_FILTER: ${{ github.event.inputs.gtest_filter || '*' }}
          MOZ_RUN_GTEST: 'True'
          MOZ_WEBRENDER: '0'
        run: |
          cd gtest-run
          tar -xf gtest-bin.tar
          export MOZ_XRE_DIR="$(cygpath -w "$PWD/bin")"
          ./bin/firefox.exe -unittest --gtest_death_test_style=threadsafe --wait-for-browser

  # The Linux leg's gtests, as gtest-cross runs Windows's:
  # the node's machine has a GPU and GitHub's runners, where they are judged, do not.
  gtest-linux:
    name: gtest-linux-x86_64
    needs: build
    if: github.event.inputs.gtests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: The leg's dist/bin with its gtest libxul
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gtest-bin-linux-x86_64
          path: gtest-run
      - name: Engine gtests (gtests=true only)
        shell: bash
        env:
          GTEST_FILTER: ${{ github.event.inputs.gtest_filter || '*' }}
          MOZ_RUN_GTEST: 'True'
          MOZ_WEBRENDER: '0'
        run: |
          sudo apt-get install -y xvfb >/dev/null
          cd gtest-run
          tar -xf gtest-bin.tar
          export MOZ_XRE_DIR="$PWD/bin"
          xvfb-run -a ./bin/firefox -unittest --gtest_death_test_style=threadsafe --wait-for-browser

  # Follows the legs on the node. It needs `node` only, so it does not wait for the
  # arm64 leg, and survives a cancel. It starts each next leg's runner when the last has
  # finished, and a machine lost mid-build re-launches the whole run once. Three jobs in
  # a row, each stopping by itself in time: GitHub ends one of its jobs at 6 hours, and
  # two legs can take 700 minutes. One that dies leaves the next to go on.
  watch-1:
    needs: [plan, node]
    if: always() && needs.plan.result == 'success' && needs.node.result == 'success' && needs.node.outputs.attempt == github.run_attempt
    runs-on: ubuntu-24.04
    environment: theta-builder
    timeout-minutes: 345
    permissions: { actions: write, contents: read }
    outputs:
      verdict: ${{ steps.watch.outputs.verdict }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The node's access
        # Without it the next leg's runner cannot start, and the watch says so; it can
        # still see the legs and the machine, and that is worth more than this step.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-access-${{ github.run_attempt }}
      - name: Watch the legs, start the next leg's runner, re-launch once if the machine is lost
        id: watch
        shell: bash
        env:
          THETA_API_KEY: ${{ secrets.THETA_API_KEY }}
          THETA_PROJECT: ${{ secrets.THETA_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # The same run again if the machine is lost: every input by value.
          KIND: ${{ needs.plan.outputs.kind }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMPILE_CACHE: ${{ needs.plan.outputs.compile_cache }}
          CORE_REF: ${{ inputs.core_ref || 'main' }}
          WRAPPER_REF: ${{ inputs.wrapper_ref || 'main' }}
          GTESTS: ${{ inputs.gtests }}
          GTEST_FILTER_INPUT: ${{ inputs.gtest_filter }}
          RELAUNCH_OF: ${{ inputs.relaunch_of }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/theta_node.py watch --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --ref "$GITHUB_REF_NAME" --access node-access.enc | tee -a "$GITHUB_OUTPUT"

  watch-2:
    needs: [plan, node, watch-1]
    if: always() && needs.plan.result == 'success' && needs.node.result == 'success' && needs.node.outputs.attempt == github.run_attempt && !contains(fromJSON('["done","lost","failed"]'), needs.watch-1.outputs.verdict)
    runs-on: ubuntu-24.04
    environment: theta-builder
    timeout-minutes: 345
    permissions: { actions: write, contents: read }
    outputs:
      verdict: ${{ steps.watch.outputs.verdict }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The node's access
        # Without it the next leg's runner cannot start, and the watch says so; it can
        # still see the legs and the machine, and that is worth more than this step.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-access-${{ github.run_attempt }}
      - name: Watch the legs, start the next leg's runner, re-launch once if the machine is lost
        id: watch
        shell: bash
        env:
          THETA_API_KEY: ${{ secrets.THETA_API_KEY }}
          THETA_PROJECT: ${{ secrets.THETA_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # The same run again if the machine is lost: every input by value.
          KIND: ${{ needs.plan.outputs.kind }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMPILE_CACHE: ${{ needs.plan.outputs.compile_cache }}
          CORE_REF: ${{ inputs.core_ref || 'main' }}
          WRAPPER_REF: ${{ inputs.wrapper_ref || 'main' }}
          GTESTS: ${{ inputs.gtests }}
          GTEST_FILTER_INPUT: ${{ inputs.gtest_filter }}
          RELAUNCH_OF: ${{ inputs.relaunch_of }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/theta_node.py watch --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --ref "$GITHUB_REF_NAME" --access node-access.enc | tee -a "$GITHUB_OUTPUT"

  watch-3:
    needs: [plan, node, watch-1, watch-2]
    if: always() && needs.plan.result == 'success' && needs.node.result == 'success' && needs.node.outputs.attempt == github.run_attempt && !contains(fromJSON('["done","lost","failed"]'), needs.watch-1.outputs.verdict) && !contains(fromJSON('["done","lost","failed"]'), needs.watch-2.outputs.verdict)
    runs-on: ubuntu-24.04
    environment: theta-builder
    timeout-minutes: 345
    permissions: { actions: write, contents: read }
    outputs:
      verdict: ${{ steps.watch.outputs.verdict }}
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The node's access
        # Without it the next leg's runner cannot start, and the watch says so; it can
        # still see the legs and the machine, and that is worth more than this step.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-access-${{ github.run_attempt }}
      - name: Watch the legs, start the next leg's runner, re-launch once if the machine is lost
        id: watch
        shell: bash
        env:
          THETA_API_KEY: ${{ secrets.THETA_API_KEY }}
          THETA_PROJECT: ${{ secrets.THETA_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # The same run again if the machine is lost: every input by value.
          KIND: ${{ needs.plan.outputs.kind }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMPILE_CACHE: ${{ needs.plan.outputs.compile_cache }}
          CORE_REF: ${{ inputs.core_ref || 'main' }}
          WRAPPER_REF: ${{ inputs.wrapper_ref || 'main' }}
          GTESTS: ${{ inputs.gtests }}
          GTEST_FILTER_INPUT: ${{ inputs.gtest_filter }}
          RELAUNCH_OF: ${{ inputs.relaunch_of }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/theta_node.py watch --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --ref "$GITHUB_REF_NAME" --access node-access.enc | tee -a "$GITHUB_OUTPUT"

  # Turns the node off as soon as its legs are done, not when the whole run is: the
  # arm64 leg on GitHub's runners may take hours more, and the node is paid by the hour.
  # When the node job did its work this asks GitHub first: a watch that crashed says
  # nothing about the legs, and a healthy build is not deleted for that. A node it leaves
  # on, the sweeper deletes as soon as its legs have finished.
  stop-node:
    needs: [plan, node, watch-1, watch-2, watch-3]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    environment: theta-builder
    timeout-minutes: 15
    permissions: { actions: read, contents: read }
    steps:
      - name: The series (this repository, this commit)
        if: always()
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: Turn the node off and see it gone
        if: always()
        timeout-minutes: 8
        env:
          THETA_API_KEY: ${{ secrets.THETA_API_KEY }}
          THETA_PROJECT: ${{ secrets.THETA_PROJECT }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ needs.node.outputs.attempt || github.run_attempt }}
          ONLY_IF: ${{ needs.node.result == 'success' && '--if-legs-done' || '' }}
        run: python3 .series/platform/ci/src/scripts/ci/theta_node.py off --run "$GITHUB_RUN_ID" --attempt "$ATTEMPT" $ONLY_IF

  # After a save, this ref's older entries of the same leg go: the repository is over
  # its cache quota. Deleting needs actions: write, so never in a job on the node.
  cache-trim:
    needs: [plan, build]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { actions: write, contents: read }
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: Delete this ref's older entries of the legs this run saved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .series/platform/ci/src/scripts/ci/cache_rules.py trim \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --ref "$GITHUB_REF"

  # One table for the whole run, on its summary page: leg x phase, result,
  # time, memory peak, compile cache hits (scripts/ci/report.py). Always,
  # so a failed or cancelled run says which leg stopped where, and why.
  report:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: The series (this repository, this commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: .series, fetch-depth: 1 }
      - name: The source tree, the Mozilla tag with our series applied (tools/engine.py)
        shell: bash
        run: python3 .series/tools/engine.py materialize --into .
      - name: The legs' events
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: events-*
          path: events
      - name: The run's summary
        run: python3 scripts/ci report events

  # The gate and the publish are written once, in gate.yml and publish.yml,
  # and republish.yml calls the same two.
  gate:
    needs: [plan, build]
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/gate.yml
    with:
      build_run_id: ${{ github.run_id }}
      seal_tag: ${{ needs.plan.outputs.seal_tag }}
      wrapper_ref: ${{ inputs.wrapper_ref || 'main' }}
      core_ref: ${{ inputs.core_ref || 'main' }}

  publish:
    needs: [plan, build, gate]
    # a candidate publishes nothing: skipped, and the run is green
    if: needs.plan.outputs.kind == 'release'
    permissions: { actions: read, contents: write }
    uses: ./.github/workflows/publish.yml
    with:
      build_run_id: ${{ github.run_id }}
      tag: ${{ needs.plan.outputs.tag }}
      num: ${{ needs.plan.outputs.num }}
      prevtag: ${{ needs.plan.outputs.prevtag }}
      wrapper_ref: ${{ inputs.wrapper_ref || 'main' }}
