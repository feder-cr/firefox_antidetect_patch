# ─────────────────────────────────────────────────────────────────────────────
# release.yml — build all 3 patched-Firefox targets (Win + Linux x2) at $0 and publish them as
# DRAFT GitHub Release assets, named per the wrapper contract (constants.ARCHIVE_NAME).
# DRAFT on purpose: a human runs the realness gate and only THEN un-drafts + bumps
# BINARY_VERSION. Nothing auto-ships (issue #14 lesson).
#
# PACKAGING (issue #14: dangling symlinks broke 265 downloads — never again):
#   Linux → cp -aL (dereference ALL symlinks into real files) + rm dev tools +
#           strip + sanitize + tar at ROOT, then validate_release.py as a HARD
#           in-pipeline gate (the exact battle-tested script from the source repo).
#   Win   → mach package; zip the CONTENTS of dist/firefox (clean tree, NOT
#           dist/bin) so firefox.exe sits at the zip ROOT.
#   macOS → mach package; ad-hoc codesign the .app; PRESERVE its internal relative
#           symlinks (a .app legitimately has them — cp -aL would break it); verify
#           every symlink is relative+internal; tar the bundle. --version self-gate.
#
# DRIVE GATE (the firefox-8 catcher): after build, every binary is DRIVEN by
# Playwright on its native runner (launch via juggler + real page + JS roundtrip,
# headless, no screenshot → GPU-free, zero proxy). A juggler-less binary renders
# a screenshot fine but is undrivable — only an actual drive catches that. The
# proxy realness gate (fppro/webrtc) stays LOCAL — it needs secrets.
#
# Trigger: push a tag `firefox-N`, or run manually.  Hybrid runners, all free.
# ─────────────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags: ['firefox-*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'firefox_antidetect_patch ref to build'
        default: 'stealth/151'
      release_tag:
        description: 'release tag to publish the draft under (e.g. firefox-9)'
        required: true

env:
  SOURCE_REPO: feder-cr/firefox_antidetect_patch
  SOURCE_REF: ${{ github.event.inputs.source_ref || 'stealth/151' }}

jobs:
  build:
    name: build-${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-x86_64
            runner: ubuntu-24.04
            family: linux
            # ⛔ Il triplet HOST va detto a mano su questa gamba, o configure si
            # ferma con "Don't know how to translate x86_64-pc-linux-gnu for
            # rustc". L'immagine ubuntu-24.04 ora fa riportare al compilatore C
            # `x86_64-pc-linux-gnu`, che Firefox non sa mappare sul nome che
            # rustc usa (`x86_64-unknown-linux-gnu`) - ed e' lo stesso sistema,
            # cambia solo come si chiama. A firefox-20 non serviva: la matrice
            # qui e' identica, a cambiare e' stata l'immagine sotto.
            # Le altre due gambe traducono da sole e restano intatte.
            host: x86_64-unknown-linux-gnu
            target: ''
            rust_target: x86_64-unknown-linux-gnu
            win_disables: 'no'
            extra_pkgs: ''
            asset: firefox-151.0-stealth-linux-x86_64.tar.gz
          - leg: linux-arm64
            runner: ubuntu-24.04-arm
            family: linux
            target: ''
            rust_target: aarch64-unknown-linux-gnu
            win_disables: 'no'
            extra_pkgs: ''
            asset: firefox-151.0-stealth-linux-arm64.tar.gz
          - leg: win-x86_64
            runner: ubuntu-24.04
            family: win
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            win_disables: 'yes'
            extra_pkgs: 'msitools p7zip-full zip'
            asset: firefox-151.0-stealth-win-x86_64.zip
    steps:
      - name: Free disk + 16G swap (Linux runners)
        run: |
          # The GH-hosted 14GB-free disk is tight for a full Firefox build: objdir
          # (.o + libxul) + `mach package` (a second dist copy) + the archive, plus
          # 16G of swap and, on the win-cross leg, the fetched MSVC toolchain. The
          # first firefox-18 win leg packaged fine and the second died on
          # `No space left on device` at packaging time - i.e. marginal, not broken.
          # Reclaim the big preinstalled caches up front so it stops being marginal.
          # Everything here is best-effort (|| true) - a missing path must never fail
          # the build.
          echo "disk before cleanup:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "disk after cleanup:"; df -h / | tail -1
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true

      - name: Checkout patched Firefox source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      # Cheapest gate in the pipeline, guarding the most expensive failure: the asset
      # basename is hand-written in every matrix entry below and derived independently
      # on the client side. When the two disagree CI publishes one name while the
      # wrapper fetches another, so every download 404s while the build is green, the
      # archives are valid and the release page looks correct (issue #14). Fail here in
      # seconds instead of after five multi-hour builds.
      - name: Check asset names match the version this tree builds
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        run: python3 scripts/check_release_naming.py

      # Record which firefox_antidetect_patch commit this build came from. The publish
      # job turns the range previous-release..this commit into the release notes
      # (scripts/gen_release_notes.py), and re-publishes it as a source-commit.txt
      # asset so the NEXT release knows where to start the changelog. One leg is
      # enough — all legs check out the same SOURCE_REF.
      - name: Record source commit (for auto release notes)
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        run: git rev-parse HEAD > source-commit.txt && cat source-commit.txt
      - name: Upload source-commit artifact
        if: matrix.leg == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-commit
          path: source-commit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux binutils ${{ matrix.extra_pkgs }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }} || true

      - name: Extend the repo .mozconfig (NO mold; +target/SDK as needed)
        run: |
          test -f .mozconfig || { echo "ERROR: no .mozconfig in source"; exit 1; }
          rm -f mozconfig
          # VIA sccache SU QUESTI RUNNER, o mach build muore prima di compilare
          # una riga: FileNotFoundError: 'sccache'.
          #
          # Il .mozconfig e' UNO SOLO per le due macchine di sviluppo e per la
          # CI, e dichiara --with-ccache=sccache piu' RUSTC_WRAPPER=sccache
          # senza percorso, apposta: il percorso e' una proprieta' della
          # macchina, e sulle due macchine sccache sta nel PATH. Su un runner
          # nudo non c'e', e nessuno se n'era accorto perche' release.yml non
          # girava da firefox-20 mentre la riga e' entrata dopo.
          #
          # E qui non servirebbe comunque: un runner e' effimero, quindi la
          # cache nasce VUOTA a ogni corsa, e la prima build con sccache e' piu'
          # LENTA di una senza perche' deve popolarla. Installarlo sarebbe
          # pagare un costo per un beneficio che non puo' esistere.
          #
          # Case-insensitive, perche' c'e' anche SCCACHE_CACHE_SIZE maiuscolo.
          # Solo le righe ATTIVE: i commenti che spiegano il perche' restano.
          sed -i -E '/^[^#]*sccache/Id' .mozconfig
          {
            echo ""
            echo "# --- release CI levers for ${{ matrix.leg }} (mold intentionally OFF — it segfaults libxul) ---"
            echo "ac_add_options --disable-debug-symbols"
          } >> .mozconfig
          if [ -n "${{ matrix.target }}" ]; then echo "ac_add_options --target=${{ matrix.target }}" >> .mozconfig; fi
          if [ -n "${{ matrix.host }}" ]; then echo "ac_add_options --host=${{ matrix.host }}" >> .mozconfig; fi
          if [ "${{ matrix.win_disables }}" = "yes" ]; then
            { echo "ac_add_options --disable-default-browser-agent";
              echo "ac_add_options --disable-maintenance-service";
              echo "ac_add_options --disable-update-agent"; } >> .mozconfig
          fi
          NCPU=4
          { echo "mk_add_options MOZ_PARALLEL_BUILD=$NCPU";
            echo "mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-rel"; } >> .mozconfig
          echo "----- final .mozconfig -----"; cat .mozconfig

      - name: Build
        run: ./mach build

      # ── LINUX: dereference symlinks (issue #14) + strip + sanitize + tar@root + GATE
      - name: Package + validate (Linux)
        if: matrix.family == 'linux'
        run: |
          set -e
          DIST=obj-rel/dist/bin
          STAGING=staging
          rm -rf "$STAGING"; mkdir -p "$STAGING" out
          cp -aL "$DIST/." "$STAGING/"                      # -L: dereference ALL symlinks into real files
          N=$(find "$STAGING" -type l | wc -l)
          [ "$N" -eq 0 ] || { echo "ERROR: $N symlinks remain after cp -aL"; exit 1; }
          for t in xpcshell certutil pk12util rapl; do rm -f "$STAGING/$t"; done
          # JUGGLER GATE: the binary is undrivable by Playwright without it (see 70-known-bugs)
          { [ -e "$STAGING/chrome/juggler.manifest" ] && [ -d "$STAGING/chrome/juggler" ]; } \
            || { echo "ERROR: juggler missing from package (chrome/juggler) — Playwright can't drive it"; exit 1; }
          echo "juggler GATE OK (loose chrome/juggler present)"
          find "$STAGING" -type f \
            \( -name '*.so' -o -name firefox -o -name firefox-bin -o -name plugin-container \
               -o -name pingsender -o -name glxtest -o -name vaapitest -o -name updater \) \
            -exec strip --strip-debug {} + 2>/dev/null || true
          STAGING="$STAGING" python3 scripts/linux_sanitize.py || true   # no-op in CI (no /home/feder), defensive
          tar --owner=0 --group=0 --numeric-owner --mtime="2026-01-01 00:00:00 UTC" \
              -czf "out/${{ matrix.asset }}" -C "$STAGING" .              # firefox at ROOT
          echo "=== HARD GATE: scripts/validate_release.py (the issue-#14 protector) ==="
          # --no-site-patterns: the site-name token list is deliberately not in this
          # repository and cannot be on a CI runner, so this leg checks structure and
          # build-machine paths only. Without the flag the run now exits 3 rather than
          # printing a warning nobody reads. The full scan is the operator's
          # pre-publish run, with STEALTH_EXTRA_LEAK_PATTERNS set.
          python3 scripts/validate_release.py --linux "out/${{ matrix.asset }}" \
            --linux-only --no-site-patterns
          ls -la out/

      # ── WINDOWS (cross): zip the CLEAN dist/firefox tree, firefox.exe at root
      - name: Package (Windows cross)
        if: matrix.family == 'win'
        run: |
          set -e
          # Do NOT swallow a mach failure: `./mach package || echo` lets set -e pass
          # and would fall through to a stale tree. A release MUST come from the clean
          # dist/firefox; dist/bin is the dev tree (cruft + loose juggler that masked
          # the firefox-7/8 packaging bugs), never acceptable for a release.
          ./mach package
          [ -f obj-rel/dist/firefox/firefox.exe ] \
            || { echo "ERROR: mach package did not produce a clean dist/firefox tree"; exit 1; }
          WIN_APP=obj-rel/dist/firefox
          echo "packaging from: $WIN_APP"
          # JUGGLER GATE: omni.ja must carry juggler (else Playwright can't drive it)
          [ -f "$WIN_APP/omni.ja" ] || { echo "ERROR: no omni.ja in $WIN_APP"; exit 1; }
          python3 -c "import zipfile,sys; sys.exit(0 if any('juggler' in n.lower() for n in zipfile.ZipFile('$WIN_APP/omni.ja').namelist()) else 1)" \
            || { echo "ERROR: juggler missing from $WIN_APP/omni.ja — Playwright can't drive it"; exit 1; }
          echo "juggler GATE OK (win)"
          mkdir -p out
          ( cd "$WIN_APP" && zip -qr "$GITHUB_WORKSPACE/out/${{ matrix.asset }}" . )   # firefox.exe at zip ROOT
          ls -la out/

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-${{ matrix.leg }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  # DRIVE GATE — the firefox-8 catcher. A raw `firefox --screenshot` proves
  # nothing about automation: a juggler-less binary renders fine and ships
  # broken (firefox-8 did exactly that). So we DRIVE every binary the way users
  # will: Playwright launches it over the juggler pipe, loads a real page, and
  # round-trips JS. A binary missing/broken juggler throws TargetClosedError
  # here and the release never publishes. Headless, NO screenshot → GPU-free,
  # so it can't false-fail on the GPU-less hosted runners. Zero proxy / zero
  # secrets → safe in public CI (the proxy realness gate stays local, by design).
  # Each leg runs on its NATIVE runner so we test the real artifact, not a cross
  # surrogate. Playwright is pinned to a version validated against this build's
  # juggler; bump it in lockstep when the juggler is re-synced from upstream.
  gate:
    name: gate-${{ matrix.leg }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # `extra: --full` adds mouse+keyboard+canvas+navsurface; `--click` adds
          # ONE move and ONE click and nothing else; no flag is SMOKE.
          #
          # ⛔ THE COMMENT THAT STOOD HERE WAS WRONG AND WOULD HAVE SHIPPED A DEAD
          # MOUSE. It said: the interaction code is platform-identical JS (omni.ja),
          # so one reliable full run catches a firefox-2-class regression for all
          # platforms. Measured 2026-08-19: a MOZILLA_OFFICIAL build shows the
          # terms-of-use preonboarding modal, a full-viewport chrome overlay that
          # swallows EVERY mouse event while the keyboard keeps working - and
          # browser/app/profile/firefox.js disables preonboarding under
          # `#ifdef XP_LINUX`, so Linux is IMMUNE. The single leg that tested the
          # mouse was the single leg that could not see the defect: all five legs
          # green, mouse dead on Windows and macOS - the target platform.
          #
          # So win and mac now run `--click`. It stays LIGHT on purpose: the
          # flakiness that made --full linux-only came from a heavy interaction
          # sequence, not from one click, and this defect class produces ZERO
          # events rather than wrong ones. See scripts/ci_drive_gate.py.
          - leg: linux-x86_64
            runner: ubuntu-24.04
            kind: linux
            asset: firefox-151.0-stealth-linux-x86_64.tar.gz
            extra: '--full'
          - leg: linux-arm64
            runner: ubuntu-24.04-arm
            kind: linux
            asset: firefox-151.0-stealth-linux-arm64.tar.gz
            extra: '--click'
          - leg: win-x86_64
            runner: windows-latest
            kind: win
            asset: firefox-151.0-stealth-win-x86_64.zip
            extra: '--click'
    steps:
      - name: Checkout wrapper (for scripts/ci_drive_gate.py)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: feder-cr/invisible_playwright
          ref: main
          fetch-depth: 1
      - name: Download asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: asset-${{ matrix.leg }}
          path: art
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install Playwright driver (no bundled browser — we override executable_path)
        # Pin from a SINGLE source (scripts/playwright_pin.txt) so release.yml and
        # verify-assets.yml can't drift to different versions. The drive gate then
        # ENFORCES playwright↔juggler compatibility: an incompatible pin fails the
        # launch/drive (TargetClosedError / protocol error) and nothing publishes.
        # Bump the pin file in lockstep when the juggler is re-synced from upstream.
        shell: bash
        run: python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
      - name: Linux system deps for headless firefox
        if: matrix.kind == 'linux'
        run: sudo "$(which python)" -m playwright install-deps firefox
      - name: Extract + locate firefox binary
        shell: bash
        run: |
          set -e
          mkdir -p ff
          A="art/${{ matrix.asset }}"
          case "${{ matrix.kind }}" in
            win)   python -c "import zipfile; zipfile.ZipFile('$A').extractall('ff')"; EXE="ff/firefox.exe";;
            linux) tar xzf "$A" -C ff; EXE="ff/firefox";;
            mac)   tar xzf "$A" -C ff; EXE="ff/Firefox.app/Contents/MacOS/firefox";;
          esac
          [ -e "$EXE" ] || { echo "ERROR: firefox binary not found at $EXE"; exit 1; }
          chmod +x "$EXE" 2>/dev/null || true
          echo "FF_EXE=$EXE" >> "$GITHUB_ENV"
          echo "located: $EXE"
      - name: DRIVE GATE — Playwright launch via juggler + real page (+ interaction on --full)
        shell: bash
        run: python scripts/ci_drive_gate.py "$FF_EXE" ${{ matrix.extra }}

      # FONT GATE - assert this leg's binary exposes EXACTLY the Windows font
      # persona: the SAME family set on every OS (the local Win/Linux parity we
      # can prove by hand), host-leak 0, and the CSS generics mapping to Windows
      # fonts. This is the ONLY place macOS/CoreText font handling is validated -
      # there is no local Mac - so a Mac-only regression (e.g. host fonts leaking
      # through CoreText, or the bundle-only skip not wired in) fails HERE, on the
      # real artifact, each architecture on its own CPU, before anything ships.
      #
      # "Each on its own CPU" is load-bearing and was not true for one release: in
      # firefox-18 the x86_64 asset was driven under Rosetta, so this gate ran
      # against a translation layer rather than an Intel machine. It cannot see an
      # Intel-only fault that way, and it stayed green.
      # Headless, no proxy, no secrets. See scripts/ci_font_gate.py in the wrapper.
      - name: FONT GATE - exactly the Windows font persona on this OS
        shell: bash
        run: python scripts/ci_font_gate.py "$FF_EXE"

      # CLOAK + WEBGL-MASKING GUARDS — run the wrapper's e2e cloak/gamma checks
      # against THIS leg's freshly-built artifact, on its native runner. The
      # wrapper's headless=True is headed+hidden (cloak on Win/macOS, its own
      # Xvfb on Linux). Linux (Xvfb + llvmpipe) and Windows (WARP) give a
      # software WebGL context on the GPU-less hosts, so the WebGL-dependent
      # assertions run there. macOS GitHub runners expose NO WebGL in the CI
      # session at all (even vanilla Firefox; macOS has no software-GL fallback),
      # so on the mac legs the WebGL checks self-skip and the cloak is validated
      # via its non-blank screenshot + CGWindowAlpha == 0. test_cloak asserts the
      # window is hidden (Windows DWMWA_CLOAKED / macOS CGWindowAlpha) AND still
      # renders — the macOS leg is the only place the cocoa cloak patch gets RUN.
      # The webgl guard catches a regression of the gamma readPixels noise back to
      # the pixelscan-maskable ±1 spike form (covered on Linux + Windows).
      # ⛔ THE CORE COMES FROM GIT, NOT FROM THE INDEX, and this is not a
      # convenience. `pip install ".[dev]"` installs the WRAPPER, which pins
      # invisible-core exactly, so pip resolves the PUBLISHED core - and during a
      # release the published core is always one step behind by construction: its
      # own version is derived from the seal, so it cannot exist until this binary
      # has been built and the seal rolled onto it.
      #
      # That means the pairing this gate used to test - new binary, previous
      # published core - IS ONE NO USER EVER GETS. A user installing core 19.14.0
      # downloads the firefox-19 binary, because that is what its seal pins. The
      # gate was validating an impossible combination.
      #
      # MEASURED on firefox-20, which is where it finally bit: the binary requires
      # zoom.stealth.text.freetype_hintstyle AND freetype_antialias, the published
      # core emits neither, and StealthDeclarationGate refuses. Not at startup -
      # a direct headless launch is fine, which is why the first diagnosis went
      # the wrong way - but on ctx.new_page(), where the browser dies with
      # exitCode 0x80000003 (a deliberate MOZ_CRASH) and Playwright reports
      # TargetClosedError. All five legs failed identically in about a minute,
      # which is the shape of a setup fault and not of five product defects.
      # Bisected with extra_prefs: either declaration alone is not enough, both
      # together revive it, and the shader-language pref is not involved.
      #
      # --force-reinstall is REQUIRED and the reason is worth knowing: the core's
      # version is derived from the seal, not bumped per commit, so git main and
      # the index both call themselves 19.14.0 and pip would consider the pin
      # already satisfied. Same version string, different code. --no-deps keeps
      # pip from re-resolving and dragging the published one back in.
      #
      # No INVISIBLE_CORE_PIN escape is needed, and that follows from the same
      # fact: the version does not move, so the wrapper's pin stays satisfied.
      - name: Cloak + WebGL-masking guards (headed)
        shell: bash
        run: |
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet --force-reinstall --no-deps \
            "git+https://github.com/feder-cr/invisible_core@main"
          python -c "from importlib.metadata import version; print('core under test:', version('invisible-core'))"
          python -m invisible_core seal --binary "$FF_EXE" \
            --tag "${{ github.event.inputs.release_tag || github.ref_name }}" \
            -o gate.seal.json
          INVISIBLE_SEAL_FILE="$PWD/gate.seal.json" INVPW_BINARY_PATH="$FF_EXE" python -m pytest \
            tests/test_cloak.py \
            "tests/test_fingerprint_surface.py::test_webgl_readpixels_no_masking_signature" \
            -m e2e -o addopts='' -q

  publish:
    name: publish-draft-release
    needs: [build, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout wrapper (for scripts/gen_release_notes.py)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: feder-cr/invisible_playwright
          ref: main
          fetch-depth: 1
      - name: Checkout source repo (for scripts/make_seal.py)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { path: _src, fetch-depth: 1 }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Download all build assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: asset-*, path: dl, merge-multiple: true }
      - name: Download source-commit metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: source-commit, path: src-meta }
      - name: Assert all 3 target archives present (no silent partial release)
        run: |
          cd dl
          EXPECTED="
          firefox-151.0-stealth-linux-x86_64.tar.gz
          firefox-151.0-stealth-linux-arm64.tar.gz
          firefox-151.0-stealth-win-x86_64.zip
          "
          for a in $EXPECTED; do
            [ -s "$a" ] || { echo "ERROR: missing/empty release asset: $a (a build leg silently dropped out?)"; exit 1; }
          done
          echo "all 3 target archives present"
      - name: Generate checksums.txt
        run: |
          cd dl; ls -la
          # explicit glob — never include checksums.txt itself (the `*`-includes-itself trap)
          sha256sum firefox-151.0-stealth-* > checksums.txt
          echo "----- checksums.txt -----"; cat checksums.txt
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # bare revision number for the release title: firefox-10 -> 10
          N="${TAG#firefox-}"
          echo "num=$N" >> "$GITHUB_OUTPUT"
          # previous release tag, for the changelog range (firefox-10 -> firefox-9)
          case "$N" in (*[!0-9]*|'') echo "prevtag=" >> "$GITHUB_OUTPUT";;
                        (*) echo "prevtag=firefox-$((N-1))" >> "$GITHUB_OUTPUT";; esac
          echo "publishing DRAFT release for tag: $TAG"
      - name: Generate + gate seal.json
        run: |
          python3 _src/scripts/make_seal.py \
            --tag "${{ steps.tag.outputs.tag }}" \
            --assets dl \
            --source-commit-file src-meta/source-commit.txt \
            --playwright-range _src/browser/config/stealth_playwright_range.txt \
            -o dl/seal.json
          echo "----- seal.json -----"; cat dl/seal.json
      - name: Build release notes from the source commits
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CUR="$(cat src-meta/source-commit.txt 2>/dev/null | tr -d '[:space:]')"
          echo "this build's source commit: ${CUR:-<none>}"
          # previous release's recorded source commit — gives the changelog range.
          # Missing (first automated notes / firefox-0) -> notes omit the changelog.
          PREV=""
          PREVTAG="${{ steps.tag.outputs.prevtag }}"
          if [ -n "$PREVTAG" ] && gh release download "$PREVTAG" -R "${{ github.repository }}" \
               --pattern source-commit.txt --dir prev 2>/dev/null; then
            PREV="$(cat prev/source-commit.txt | tr -d '[:space:]')"
            echo "previous ($PREVTAG) source commit: $PREV"
          else
            echo "no previous source-commit.txt — changelog section omitted this time"
          fi
          python scripts/gen_release_notes.py --tag "${{ steps.tag.outputs.tag }}" \
            --current "$CUR" --prev-sha "$PREV" --source-repo "${{ env.SOURCE_REPO }}" > body.md
          echo "----- generated body.md -----"; cat body.md
          # publish THIS build's source commit so the next release can diff from it
          cp src-meta/source-commit.txt dl/source-commit.txt
      - name: Create DRAFT release with all assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: firefox_antidetect_patch (151.0) rev ${{ steps.tag.outputs.num }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dl/*.tar.gz
            dl/*.zip
            dl/checksums.txt
            dl/source-commit.txt
            dl/seal.json
          body_path: body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
