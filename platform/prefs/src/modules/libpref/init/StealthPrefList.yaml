# Our static prefs: a second input of generate_static_pref_list.py next to
# Mozilla's StaticPrefList.yaml (modules/libpref/moz.build), so the Mozilla file
# stays as shipped. Same format and same rules: the generator checks each file
# on its own (names unique, prefs grouped by their first segment, groups in
# order) and merges them, so a pref here behaves exactly as one declared there.
#
# The prefs are the contract with invisible_core: names and defaults do not
# change without the client. Defaults keep a build launched without the client
# behaving as stock Firefox.

#---------------------------------------------------------------------------
# Prefs starting with "juggler."
#---------------------------------------------------------------------------

# STEALTHFOX (firefox-50): the time zone and the language the SESSION
# declares, written by invisible_core: an IANA zone, and an Accept-Language
# list ("it-IT, it, en-US, en"). The only C++ reader is
# intl/locale/StealthSessionPrefs.h.
#
# Static, with a default, so that they reach content processes: a string pref
# with no default is kept in the parent (ShouldSanitizePreference), and the
# language once reached no worker for that reason (71-bug-archive.md [B165]).
# DataMutexString with a mirror, so that any thread reads them: a worker's
# realm options are built on the main thread, but the fallback language of
# text without `lang` may first be asked by an OffscreenCanvas on a worker
# (nsLanguageAtomService::GetLocaleLanguage). They lived in all.js until
# firefox-50, readable on the main thread only.
- name: juggler.locale.override
  type: DataMutexString
  value: ""
  mirror: always

- name: juggler.timezone.override
  type: DataMutexString
  value: ""
  mirror: always

#---------------------------------------------------------------------------
# Prefs starting with "zoom."
#---------------------------------------------------------------------------

# The session seed. Atomic because it is read off the main thread: the canvas
# noise runs on worker threads (an OffscreenCanvas in a worker) and in the GPU
# process on the CanvasTranslator's task queue, and a plain int32_t mirror is
# only safe to read from the main thread. Same name and same values as before:
# it is the contract with invisible_core.
- name: zoom.stealth.fpp.hw_seed
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.screen.width
  type: int32_t
  value: -1
  mirror: always

- name: zoom.stealth.screen.height
  type: int32_t
  value: -1
  mirror: always

- name: zoom.stealth.audio.sample_rate
  type: int32_t
  value: -1
  mirror: always

# Stealthfox [B300]: when above 0, the device enumeration is DECLARED, not
# asked of the host. The speakers are not enumerated (with fake cameras and
# microphones they were the only thing asked of the machine, through its audio
# stack: retail Windows takes ~250 ms on its first enumeration, 251-255 ms
# with fake devices too, and a host without audio a few ms), and the first
# enumeration answers after this many milliseconds, which the client draws
# from the session seed. 0 is stock Firefox.
- name: zoom.stealth.media.enumeration_ms
  type: uint32_t
  value: 0
  mirror: always

# Diagnostic gate (2026-06-22): when false, disable the per-session OfflineAudioContext
# noise even if hw_seed > 0. Lets us isolate whether the audio noise (vs the font jitter)
# is what drives a commercial fingerprinting service's tampering_ml on Windows. Default true = noise on (legacy behaviour).
- name: zoom.stealth.audio.fp_noise
  type: RelaxedAtomicBool
  value: true
  mirror: always

- name: zoom.stealth.audio.output_latency_ms
  type: int32_t
  value: -1
  mirror: always

- name: zoom.stealth.audio.max_channel_count
  type: int32_t
  value: -1
  mirror: always

- name: zoom.stealth.hw_concurrency
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# "C'e' un proxy: non risolvere niente in locale." Il core lo sa e lo dichiara;
# il motore da solo non puo' saperlo, ed e' esattamente questo il punto.
#
# `DNSForbiddenByActiveProxy` blocca la risoluzione lato client solo se
# `network.proxy.type` e' MANUAL E c'e' una versione SOCKS con la sua
# `remote_dns`. Con un endpoint HTTP il wrapper non scrive nessuna
# `network.proxy.*` - instrada Playwright, per canale, perche' e' l'unico che
# sappia rispondere al 407 - quindi `type` resta 5 e il cancello non e' armato
# affatto. Upstream lo sa: il TODO del bug 1890542 accanto a quel controllo dice
# di usare `nsIProxyInfo` invece delle prefs.
#
# I canali stanno bene comunque (il filtro di Juggler mette
# TRANSPARENT_PROXY_RESOLVES_HOST), ma tre superfici NON sono canali e chiamano
# `AsyncResolveNative` diretto: `NetworkConnectivityService`, le sonde
# dell'euristica DoH, e il resolver ICE. Misurato il 2026-08-25 dietro un proxy
# HTTP, due giri identici: `example.org` 28, `ipv4only.arpa` 12,
# il nome di un resolver DoH pubblico 6 e - la peggiore - `stunprobe.invalid` 6, che e' un nome
# scelto DALLA PAGINA via `iceServers`, quindi il server autoritativo del sito
# vede il resolver di casa mentre l'HTTP esce dal proxy. Dietro SOCKS gli stessi
# nomi fanno 0 e ne restano 3 in tutto.
#
# `false` di default: una build lanciata senza invisible_core si comporta
# esattamente come prima.
- name: zoom.stealth.dns.no_local_resolution
  type: RelaxedAtomicBool
  value: false
  mirror: always

# The declared navigator.maxTouchPoints. Was a literal 0 in Navigator.cpp: the
# right value for the desktop personas we ship, but a constant buried in C++ is
# not pinnable, not inspectable and not overridable from extra_prefs, and a
# touchscreen persona would have needed a browser rebuild. -1 keeps the
# compiled behaviour so a build launched without invisible_core is unchanged.
- name: zoom.stealth.webrtc.no_direct_udp
  type: RelaxedAtomicBool
  value: false
  mirror: always

- name: zoom.stealth.max_touch_points
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# B149, rule 7-ter. Whether a toplevel X11 window that another window FULLY
# covers is treated as occluded, which makes its pages `hidden` and inactive
# (rAF and timers throttled, enumerateDevices waiting). Windows has the same
# behaviour behind widget.windows.window_occlusion_tracking.enabled, which
# invisible_core turns off; this is the Linux side of the same declaration,
# emitted by the core from the same value. `true` keeps upstream behaviour for
# a build launched without invisible_core.
- name: zoom.stealth.widget.occlusion_tracking.enabled
  type: RelaxedAtomicBool
  value: true
  mirror: always

# B149. When true, a window does not give up its activation because the SYSTEM
# took it (AppWindow::WindowDeactivated): another application or another
# session's window on the same display. It still gives it up to this session's
# own windows, whose activation lowers it first (AppWindow::WindowActivated).
# Declared by invisible_core; `false` keeps upstream behaviour for a build
# launched without it.
- name: zoom.stealth.focus.ignore_os_deactivation
  type: RelaxedAtomicBool
  value: false
  mirror: always

# The declared screen colour depth. Without it nsScreen::PixelDepth returns
# nsDeviceContext::GetDepth(), i.e. the REAL panel. The field-by-field audit
# (19-field-declaration-audit.md) caught it only because it asks for proof
# rather than for agreement: it reads 24 on both development machines because
# both happen to be 24-bit, so it matched cross-OS by coincidence and not by
# declaration. A user on a 30-bit display would report 30 under a Windows
# persona that says nothing of the sort.
# Height in CSS pixels of the strip screen.availHeight is short of
# screen.height - the Windows taskbar. The engine subtracted a hardcoded 48 and
# the generator computed avail_height with its own hardcoded 48, in two
# languages with nothing tying them together, so a persona that ever needed a
# different one (auto-hide, a second monitor, a scaled display) had to be
# changed in both. -1 is UNDECLARED and refuses in StealthDeclarationGate; it
# used to mean "keep the compiled 48", which was the fallback engine rule 7
# forbids since 2026-08-09.
- name: zoom.stealth.screen.taskbar_px
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.screen.color_depth
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# Where the window sits on the screen, and how much of it is not the page.
#
# outerWidth/outerHeight are already spoofed to the full screen (see
# GetOuterSize), i.e. we claim a MAXIMIZED window. The position was not
# declared at all, so it stayed whatever the OS gave the headless widget, and
# on Windows that is (4,4). A maximized window 1920 wide starting at x=4 has
# its right edge at 1924 on a 1920 screen, which is impossible on any real
# machine and needs no fingerprint database to notice - one addition does it.
#
# Measured against stock Firefox 151 on 2026-08-09, which is coherent to the
# pixel: screenX = screenY = 0, outerWidth - innerWidth = 0, and
# mozInnerScreenY - screenY = 85 = outerHeight - innerHeight. Our build
# reported screenX = 4, mozInnerScreenX = 15 (so 11px of left border) while
# claiming 0 horizontal chrome - three numbers that cannot all be true.
#
# chrome_w is the TOTAL horizontal chrome. Stock reports 0, so both borders are
# 0 and mozInnerScreenX is simply window_x; if a persona ever pins a non-zero
# one, splitting it evenly between the two sides is the only assumption
# available, and it is written in the code rather than left implicit.
# The CSS interaction media features: `pointer`, `hover`, `any-pointer`,
# `any-hover`. Bitmask of PointerCapabilities (ServoTypes.h): Coarse 1, Fine 2,
# Hover 4. A desktop with a mouse is 6; a touch laptop is 7 for the union and
# still 6 for the primary pointer.
#
# nsMediaFeatures.cpp compiled `Fine | Hover` for both, which was right about
# the leak it was stopping - GetAllPointerCapabilities adds Coarse whenever the
# HOST has touch - and wrong about being a second source: the core already says
# how many touch points the persona has, and a touch-laptop persona could not
# be expressed at all. Both are derived from hardware.max_touch_points now, so
# any-pointer, dom.w3c_touch_events.enabled and navigator.maxTouchPoints move
# together instead of contradicting each other, which on 2026-08-09 they did.
- name: zoom.stealth.pointer.primary
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.pointer.all
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# The window frame, in DEVICE pixels, measured on retail Firefox 151 on
# Windows 11 at the four persona scales (70-known-bugs.md B258, B261). Device
# pixels because that is where the rule is one rule: an invisible resize border
# on three sides (8, 9, 11, 13 at 100/125/150/200%), the browser UI above the
# content of a maximized window, the popup UI above its content, and the
# default position of a popup opened without one. The engine converts with the
# window's own scale and Gecko's rounding, as it does for the real values, so
# 107 device pixels at 1.25 read 85.6 CSS like retail does.
#
# They replace screen.window_x/window_y/chrome_w/chrome_h (CSS integers), whose
# model was a window at (0, 0) with no border: a maximized Windows window sits
# at (-8, -8) and is 16 wider than the work area, and every popup answered the
# maximized window's numbers.
- name: zoom.stealth.screen.frame_border
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.screen.maximized_ui
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.screen.popup_ui
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.screen.popup_position
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# The work area in device pixels (panel minus the taskbar at the persona's
# scale): the maximized window is this plus a border on each side. The CSS
# screen and taskbar above stay what nsScreen answers; the core derives both
# from the same panel, so they agree.
- name: zoom.stealth.screen.avail_device_width
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.screen.avail_device_height
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.webgl.renderer
  type: DataMutexString
  value: ""
  mirror: always

- name: zoom.stealth.webgl.vendor
  type: DataMutexString
  value: ""
  mirror: always

# La LINGUA in cui `getTranslatedShaderSource` risponde alla pagina. Dominio
# finito e con un elemento solo: "essl". Vuota = nessuna dichiarazione, e la
# lingua resta quella che il contesto GL impone.
#
# Non e' la STRINGA a essere dichiarata - quella ha dominio infinito, perche' lo
# shader in ingresso e' arbitrario. E' la LINGUA, che ne ha uno. La stringa la
# calcola il traduttore ANGLE imbarcato con le stesse risorse dichiarate, quindi
# la risposta e' identica a quella di una build Windows per costruzione e non
# per coincidenza misurata.
#
# Il motivo: su un contesto NON GLES (il GLX di Linux) il traduttore emette GLSL
# desktop, e la pagina legge `#version 450` mentre `RENDERER` dichiara ANGLE.
# ANGLE non emette mai GLSL desktop, quindi la risposta contraddice la persona
# che dichiariamo NOI, e il confronto e' interno alla stessa pagina: non serve
# sapere su che sistema operativo giriamo per vederlo.
- name: zoom.stealth.webgl.shader_output_language
  type: DataMutexString
  value: ""
  mirror: always

# Lo STILE DI HINTING con cui FreeType carica un glifo, e se l'antialias e'
# acceso. Sono i due soli parametri, dei sei che `PrepareFontOptions` chiedeva
# al pattern fontconfig, che spostano i pixel: misurato il 2026-08-16, un
# parametro per volta, `rgba` `lcdfilter` e `embeddedbitmap` non ne muovono
# nessuno.
#
# -1 = non dichiarato. Il gate delle dichiarazioni rifiuta l'avvio in quel caso,
# perche' cadere sul pattern sarebbe chiedere alla macchina: stesso binario e
# stessa pagina davano hash diversi al variare di `/etc/fonts`.
#
# hintstyle: 0 = none, 1 = slight, 2 = medium, 3 = full. Sono i valori di
# `FC_HINT_*`, non una nostra numerazione, cosi' non c'e' una traduzione in
# mezzo che possa divergere.
#
# Su Windows non esiste fontconfig e questi due non vengono letti: la
# dichiarazione e' la stessa per le due piattaforme, ed e' il motore a leggere
# quella che lo riguarda.
- name: zoom.stealth.text.freetype_hintstyle
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

- name: zoom.stealth.text.freetype_antialias
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# WebGL1 / WebGL2 supported-extensions whitelist (comma-separated).
# Read by ClientWebGLContext::GetSupportedExtensions and IsSupported.
# Empty = use native list (real driver extensions). Non-empty = return this
# list verbatim and reject any extension NOT in it. Used to hide Linux/Mesa
# extensions and mirror a canonical Windows ANGLE extension set.
- name: zoom.stealth.webgl.extensions
  type: DataMutexString
  value: ""
  mirror: always

- name: zoom.stealth.webgl2.extensions
  type: DataMutexString
  value: ""
  mirror: always

# WebGL getParameter() int32 override table. Comma-separated "ENUM|int"
# entries (ENUM in decimal, e.g. 3379 = GL_MAX_TEXTURE_SIZE). Used to
# return Windows ANGLE canonical values from GetParameter(pname) when
# the host's real driver (Mesa on Linux) would give different numbers —
# A commercial fingerprinting service's parameter hash matches Windows only when this is populated.
- name: zoom.stealth.webgl.int_params
  type: DataMutexString
  value: ""
  mirror: always

# Same but for float/float[2] params. "ENUM|a" or "ENUM|a:b" for vec2.
- name: zoom.stealth.webgl.float_params
  type: DataMutexString
  value: ""
  mirror: always

# Same but for int[2] (like MAX_VIEWPORT_DIMS). "ENUM|a:b"
- name: zoom.stealth.webgl.int2_params
  type: DataMutexString
  value: ""
  mirror: always

# Windows ANGLE canonical getShaderPrecisionFormat() triples. Closes a commercial fingerprinting service's
# webgl_extensions.shader_precisions hash signal — Linux Mesa returns
# different range/precision than Win D3D11. Format:
# "SHADERTYPE*PRECISIONTYPE|rangeMin:rangeMax:precision,..." where
# SHADERTYPE=35632 (FRAGMENT) or 35633 (VERTEX), PRECISIONTYPE=36336..36341
# (LOW_FLOAT..HIGH_INT). E.g. "35633*36338|-127:127:23". Empty = native.
- name: zoom.stealth.webgl.shader_precisions
  type: DataMutexString
  value: ""
  mirror: always

# CSS system-ui generic family (e.g. "Segoe UI"). When set, the system-ui
# generic resolves to exactly this family on every host. Empty = vanilla.
- name: zoom.stealth.font.system_ui
  type: DataMutexString
  value: ""
  mirror: always

# The canvas noise is on: the WebGL and WebGPU pixels a page reads, and the
# pixels such a canvas hands over as the source of another drawing, go through
# gfx::StealthProjectPixels (gfx/2d/StealthCanvasProjection.h). A 2D canvas is
# never projected (from firefox-52): it reads back as drawn, as on retail.
# Declared by invisible_core. The name is the one the core has always written;
# it used to choose between two older algorithms, and
# zoom.stealth.webgl.substitute_pixels and zoom.stealth.canvas.noise_skip_mask,
# which tuned them, are gone with them.
- name: zoom.stealth.canvas.substitute_pixels
  type: RelaxedAtomicBool
  value: false
  mirror: always

# How far, in RGBA channel units with the low bit of R, G and B cleared, a
# colour of a pixel's 3x3 neighbourhood may sit from the segment between the two
# farthest colours there and still count as a BLEND OF TWO. Such a pixel (text
# at any contrast, the antialiased edge between two fills, a two-stop gradient)
# is left exactly as drawn by the canvas noise; only a neighbourhood with a third
# independent colour is touched. Declared by invisible_core (0-255); -1 is NOT
# DECLARED, and the declaration gate refuses it.
- name: zoom.stealth.canvas.edge_tolerance
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# Synthetic speech voices (comma-separated entries, each "NAME|LANG|D|L").
# Read by SpeechSynthesis::GetVoices — when set, bypass the OS voice
# registry entirely and return fabricated voices with these fields. Accessors
# on SpeechSynthesisVoice parse the URI (stealth-voice:NAME|LANG|D|L) to
# answer GetName/GetLang/LocalService/Default queries. Empty = native list.
- name: zoom.stealth.voices.list
  type: DataMutexString
  value: ""
  mirror: always

# The branding a page reads under chrome://branding/content/ and
# resource://usercontext-content/branding/: a file: URI of the zip archive whose
# root entries are the files. invisible_core ships the sets (the retail brand,
# ours) and accepts a caller's own archive; the engine keeps no stealth copy and
# serves what is declared here as jar:, the channel class the retail uses. With
# the engine on, empty, malformed, not a zip or holding anything but root files
# refuses the launch (StealthDeclarationGate) and fails the load
# (netwerk/protocol/res/StealthBranding.h) instead of serving the build's own
# brand.
- name: zoom.stealth.branding.archive
  type: DataMutexString
  value: ""
  mirror: always

# Glyph-edge coverage ladder: the distinct alpha levels a Windows rasteriser
# produces on an antialiased glyph edge, ascending, comma separated. Measured
# 2026-08-07 over 48 family/size/weight combinations: Windows yields 9-19
# levels per render and FreeType 193-256, and a detector does not need to
# compare a hash to separate those - it can COUNT. Empty disables the snap.
# Delivered by invisible_core rather than the font manifest: it is not a
# property of any font FILE, it is what the rasteriser does to an edge.
#
# Applied to the A8 GLYPH MASK, in SkScalerContext::getImage, where both the
# DirectWrite and the FreeType scaler land and the mask is greyscale coverage by
# construction. It was applied to the composited RGBA buffer at canvas readback
# until 2026-08-08, where it had to guess which pixels were text by testing that
# the three colour channels agreed - and coloured text has r != g != b, so on
# a commercial fingerprinting service's own canvas (#006699) it was a total no-op. The name still
# says "canvas" in the docs of that era; the pref is spelled for what it does.
- name: zoom.stealth.text.coverage_ladder
  type: DataMutexString
  value: ""
  mirror: always

# The Windows text quality, declared instead of asked of the host
# (SystemParametersInfo SPI_GETFONTSMOOTHING / SPI_GETFONTSMOOTHINGTYPE):
# 0 = no smoothing (DEFAULT_QUALITY), 4 = standard antialiasing
# (ANTIALIASED_QUALITY), 5 = ClearType (CLEARTYPE_QUALITY). It sets the
# antialiasing of canvas text and gates whether the declared
# gfx.font_rendering.cleartype_params.* apply at all; asked of the host, an RDP
# session or a server with ClearType off drew different text from the same
# binary ([B362]). -1 is NOT DECLARED, and the declaration gate refuses it.
- name: zoom.stealth.text.system_quality
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# The whole font manifest, carried by invisible_core and preferred over the
# copy in NS_GRE_DIR/fonts/. Families, per-face vertical metrics, the alias
# table, the coverage ladder and the per-script fallback lists - one pref
# rather than one per table, because the binary already parses this text.
# Empty means "use the file", which is what keeps a browser launched without
# that package rendering with fonts instead of none.
# The CSS generic families, as "generic|lang|family" records separated by
# NEWLINES: generic is one of serif/sans-serif/monospace/cursive, lang is a
# Gecko langgroup ("x-math", "ja", "ko", "zh-CN", "zh-TW") or empty for the
# default, and family is the Windows face that answers.
#
# It was a table compiled into gfxPlatformFontList.cpp - about ten rows, a
# finite and perfectly known domain, and therefore exactly the kind of value
# that belongs where every other declared surface lives rather than in C++
# where changing it costs a browser rebuild. Empty keeps the compiled table,
# which stays as the floor for a browser launched without invisible_core.
- name: zoom.stealth.fonts.generics
  type: DataMutexString
  value: ""
  mirror: always

- name: zoom.stealth.fonts.manifest
  type: DataMutexString
  value: ""
  mirror: always

# What this build reports it can DECODE, as "trackmime|no|sw|hw|swhw" entries
# separated by NEWLINES, consulted in PDMFactory::Supports before any platform
# module is asked. The track mime types are Gecko's own small set - video/avc,
# video/hevc, video/av1, video/vp9, audio/opus and a dozen more - so declaring
# them covers every codec string that can be built out of them.
#
# This replaced a table of whole type STRINGS in DecoderTraits on 2026-08-08.
# That table could only ever hold the strings somebody had seen: measured that
# day it carried 3 of the 12 rows where our Linux build and retail Windows
# actually disagreed, and the space it was trying to cover - profile x
# constraint x level x container x the audio codec travelling along - is not
# enumerable. Empty leaves the media stack alone; a type not named falls through.
- name: zoom.stealth.media.decode_support
  type: DataMutexString
  value: ""
  mirror: always

# Declared mediaCapabilities.decodingInfo answers, as
# "containermime|codecfamily|SSP" entries separated by NEWLINES, where the three
# digits are supported, smooth and powerEfficient. Keyed by BOTH the container
# and the codec family because powerEfficient is not a property of the track
# mime alone: measured on retail Windows, vp09.00.10.08 in video/mp4 reports
# powerEfficient true and a bare vp9 in video/webm reports false, and both build
# a video/vp9 track. Empty leaves decodingInfo alone.
- name: zoom.stealth.media.decoding_info
  type: DataMutexString
  value: ""
  mirror: always

# zoom.stealth.timezone WAS HERE and is gone. Nothing read it - not one C++,
# JS or JSM file in the tree - while its own comment said "Single source of
# truth for StealthFox timezone spoofing. Takes priority over
# juggler.timezone.override". The comment was describing an intention; the code
# never implemented it, and the real channel is juggler.timezone.override plus
# the TZ environment variable. Removed 2026-08-09 after grepping for a reader
# and finding none. A declared pref nobody reads is worse than no pref: the next
# reader trusts the comment.

# Storage quota override (megabytes). When > 0, navigator.storage.estimate()
# returns exactly this value (in MB) to the page, overriding the disk-based
# group/origin limit. -1 (default) = vanilla Firefox behavior. Python Forge
# samples this conditional on gpu_class to fake realistic SSD sizes without
# exposing the real host disk size as a fingerprint signal.
- name: zoom.stealth.storage.quota_mb
  type: RelaxedAtomicInt32
  value: -1
  mirror: always

# zoom.stealth.webrtc.public_ip e zoom.stealth.webrtc.disable_ipv6 sono state
# TOLTE il 2026-08-25. Non erano inutilizzate: erano la SECONDA fonte. Il ponte
# nativo (nr_stealth_bridge.cpp) leggeva pref E variabile d'ambiente, con
# precedenze diverse da funzione a funzione, e quale delle due decidesse
# dipendeva dalla presenza del proxy - con proxy vinceva l'ambiente, senza
# proxy la pref. Adesso la fonte e' una sola, l'ambiente, scritta sempre da
# entrambi i percorsi di lancio di invisible_core. Non vanno reintrodotte: un
# valore che il motore puo' leggere da due posti puo' divergere fra i due.

# Optional fake LAN host IP for the synthetic host candidate base.
# Empty = leave host gathering to native code (mDNS *.local obfuscation).
# QUESTA RESTA: la legge StealthIceGathering.cpp, che non passa dal ponte, e
# invisible_core la dichiara (derivata dal seed). Una fonte, un lettore.
- name: zoom.stealth.webrtc.host_ip
  type: DataMutexString
  value: ""
  mirror: always
