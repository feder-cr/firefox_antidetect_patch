# ─────────────────────────────────────────────────────────────────────────────
# gate.yml — THE gate of a build: drive, hidden desktop, WebGL and host, on
# each leg's native runner. Called by release.yml on the archives it just
# built and by republish.yml on another run's, and written ONCE for both.
#
# Until 2026-10-17 each of the two carried its own copy, and republish's had
# drifted: no font gate, no `--click` on Windows and arm64, the published core
# instead of the one from git and no seal, so it could not gate a new engine
# at all (EngineMismatch), which is exactly when it is needed. Two copies of a
# gate are two gates, and the one that runs less goes stale first.
# ─────────────────────────────────────────────────────────────────────────────
name: gate

on:
  workflow_call:
    inputs:
      build_run_id:
        description: the run whose asset-* artifacts to gate (the caller's own, or another's)
        type: string
        required: true
      seal_tag:
        description: the tag of the local seal the wrapper's guards run under (the plan's)
        type: string
        required: true
      wrapper_ref:
        type: string
        default: main
      core_ref:
        type: string
        default: main

jobs:
  # DRIVE GATE — the firefox-8 catcher. A raw `firefox --screenshot` proves
  # nothing about automation: a juggler-less binary renders fine and ships
  # broken (firefox-8 did exactly that). So we DRIVE every binary the way users
  # will: Playwright launches it over the juggler pipe, loads a real page, and
  # round-trips JS. A binary missing/broken juggler throws TargetClosedError
  # here and the release never publishes. Headless, NO screenshot → GPU-free,
  # so it can't false-fail on the GPU-less hosted runners. Zero proxy / zero
  # secrets → safe in public CI (the proxy realness gate stays local, by design).
  # Each leg runs on its NATIVE runner so we test the real artifact, not a cross
  # surrogate. Playwright is pinned to a version validated against this build's
  # juggler; bump it in lockstep when the juggler is re-synced from upstream.
  gate:
    name: gate-${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `extra: --full` adds mouse+keyboard+canvas+navsurface; `--click` adds
          # ONE move and ONE click and nothing else; no flag is SMOKE.
          #
          # ⛔ THE COMMENT THAT STOOD HERE WAS WRONG AND WOULD HAVE SHIPPED A DEAD
          # MOUSE. It said: the interaction code is platform-identical JS (omni.ja),
          # so one reliable full run catches a firefox-2-class regression for all
          # platforms. Measured 2026-08-19: a MOZILLA_OFFICIAL build shows the
          # terms-of-use preonboarding modal, a full-viewport chrome overlay that
          # swallows EVERY mouse event while the keyboard keeps working - and
          # browser/app/profile/firefox.js disables preonboarding under
          # `#ifdef XP_LINUX`, so Linux is IMMUNE. The single leg that tested the
          # mouse was the single leg that could not see the defect: all five legs
          # green, mouse dead on Windows and macOS - the target platform.
          #
          # So win and mac now run `--click`. It stays LIGHT on purpose: the
          # flakiness that made --full linux-only came from a heavy interaction
          # sequence, not from one click, and this defect class produces ZERO
          # events rather than wrong ones. See scripts/ci_drive_gate.py.
          - leg: linux-x86_64
            runner: ubuntu-24.04
            kind: linux
            extra: '--full'
          - leg: win-x86_64
            runner: windows-latest
            kind: win
            extra: '--click'
    steps:
      - name: Checkout wrapper (for scripts/ci_drive_gate.py)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          # ⛔ NOT hardcoded to main. The gate validates the BINARY, and the
          # wrapper is only the instrument it is driven with: unfinished work
          # on the wrapper's main must not be able to block a binary release.
          # Default stays main, because main is what gets published next and is
          # therefore the honest pairing - this is an escape hatch, not a
          # change of policy.
          #
          # ⛔ AND THIS IS NOT THE SAME QUESTION AS THE CORE, which is
          # installed from git@main a few steps below and must STAY that way:
          # during a release the published core is one step behind BY
          # CONSTRUCTION, because its version derives from a seal that cannot
          # exist until this binary is built. Pinning the core to the index
          # tests a pairing no user ever gets, and it bit on firefox-20.
          ref: ${{ inputs.wrapper_ref }}
          fetch-depth: 1
      - name: Download asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: asset-${{ matrix.leg }}
          path: art
          # another run's artifacts need the token; this run's do not
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ inputs.build_run_id != github.run_id && github.token || '' }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      # The GeoIP database is made by the wrapper (scripts/ci_lab_geoip.py: the same bytes every run, the sha256 in its ci/geoip.json), never a site: without STEALTHFOX_GEOIP_MMDB the core asks GitHub
      # which database is the latest on every call, from the python of the test (run 43211837926: a resolver trap counted github.com and
      # api.github.com as the browser's). The variable reaches every later step of the job, `sudo -E` carries it to a root leg, and the judge
      # turns a leg that launched without it red. The wrapper checked out above is the one that carries the script and the pin: a wrapper_ref without them fails here.
      - name: The GeoIP database (made by the repository, same bytes every run)
        shell: bash
        run: python scripts/ci_lab_geoip.py build --pin ci/geoip.json
      - name: Install Playwright driver (no bundled browser — we override executable_path)
        # Pin from a SINGLE source (scripts/playwright_pin.txt) so release.yml and
        # verify-assets.yml can't drift to different versions. The drive gate then
        # ENFORCES playwright↔juggler compatibility: an incompatible pin fails the
        # launch/drive (TargetClosedError / protocol error) and nothing publishes.
        # Bump the pin file in lockstep when the juggler is re-synced from upstream.
        shell: bash
        run: python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
      - name: Linux system deps for headless firefox
        if: matrix.kind == 'linux'
        run: sudo "$(which python)" -m playwright install-deps firefox
      - name: Extract + locate firefox binary
        shell: bash
        run: |
          set -e
          mkdir -p ff
          # The one archive of this leg, whatever version it carries: the name is
          # derived from the tree at build time (scripts/ci/legs.py), not here.
          set -- art/firefox-*-stealth-${{ matrix.leg }}.*
          [ "$#" -eq 1 ] && [ -e "$1" ] || { echo "ERROR: expected one firefox-*-stealth-${{ matrix.leg }} archive in art/, found: $*"; exit 1; }
          A="$1"
          case "${{ matrix.kind }}" in
            win)   python -c "import zipfile; zipfile.ZipFile('$A').extractall('ff')"; EXE="ff/firefox.exe";;
            linux) tar xzf "$A" -C ff; EXE="ff/firefox";;
          esac
          [ -e "$EXE" ] || { echo "ERROR: firefox binary not found at $EXE"; exit 1; }
          chmod +x "$EXE" 2>/dev/null || true
          echo "FF_EXE=$EXE" >> "$GITHUB_ENV"
          echo "located: $EXE"
      # THE CORE UNDER TEST AND THE SEAL OF THE BINARY, BEFORE ANYTHING DRIVES IT. The drive gate launches through the
      # wrapper and the core, not through bare Playwright: since firefox-63 the engine holds every channel that asks the
      # proxy service until the client says how the session leaves the host, and only the core's launch says it first
      # (run 43134774602: Page.goto timed out on both legs). What follows is the install of core_ref from git, the
      # assertion that it is the core under test, and the seal of the binary; the guards below reuse them. The reasons
      # for each switch are written at the guards.
      - name: The core under test (core_ref, from git), the wrapper, and the seal of the binary
        shell: bash
        env:
          CORE_REF: ${{ inputs.core_ref }}
          SEAL_TAG: ${{ inputs.seal_tag }}
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          CORE_GIT="git+https://github.com/oss-invisible/core@$CORE_REF"
          python -m pip install --quiet "$CORE_GIT"
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet --force-reinstall "$CORE_GIT"
          python - <<'PY'
          import json, os, re, subprocess, sys
          from importlib.metadata import distribution, version
          ref = os.environ["CORE_REF"]
          if re.fullmatch(r"[0-9a-f]{40}", ref):
              want = ref
          else:
              rows = [line.split() for line in subprocess.run(
                  ["git", "ls-remote", "https://github.com/oss-invisible/core", ref, ref + "^{}"],
                  capture_output=True, text=True, check=True).stdout.splitlines() if line.strip()]
              peeled = [s for s, r in rows if r.endswith("^{}")]  # an annotated tag: its commit, not the tag object
              want = (peeled or [s for s, _ in rows] or [""])[0]
          import invisible_playwright  # noqa: F401 - the import-time pin repair runs here, as under pytest
          raw = distribution("invisible-core").read_text("direct_url.json")
          got = (json.loads(raw).get("vcs_info") or {}).get("commit_id") if raw else None
          print("core under test: %s from %s" % (version("invisible-core"), got or "the index"))
          if not want or got != want:
              sys.exit("THE CORE UNDER TEST IS NOT core_ref: installed %s from %s, core_ref %r is %s. "
                       "Something put another core over the git install (an install after it, or the wrapper's "
                       "import-time repair with INVISIBLE_CORE_AUTOFIX not off), and with the published core "
                       "the engine refuses the launch on the declarations that core does not emit."
                       % (version("invisible-core"), got or "the index", ref,
                          want or "not a full sha nor a ref of invisible_core"))
          PY
          python -m invisible_core seal --binary "$FF_EXE" \
            --tag "$SEAL_TAG" \
            -o gate.seal.json
      # THE PROTOCOL MIRROR OF THE CORE UNDER TEST AGREES WITH THE Protocol.js OF THIS BINARY, BEFORE THAT CORE IS PUBLISHED. The mirror
      # (invisible_core/juggler/protocol.py) is generated from the Protocol.js inside the shipped engine and nothing else holds it to it: the
      # wrapper's e2e checks it (`_gen_protocol --check`) only with the core from the index, i.e. after the core is out (core 63.66.0 went out
      # with two hand-edited fields and the wrapper's release PR was the first to see the drift). Here the core is core_ref, the binary is the
      # one under test, and `publish` waits for this job. One leg: Protocol.js is the same file in every build of an engine.
      - name: The core's protocol mirror agrees with the binary's Protocol.js (one leg)
        if: matrix.leg == 'linux-x86_64'
        shell: bash
        run: python -m invisible_core.juggler._gen_protocol --check --binary "$(dirname "$FF_EXE")"
      - name: DRIVE GATE — the wrapper launches the binary via juggler + real page (+ interaction on --full)
        shell: bash
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          INVISIBLE_SEAL_FILE="$PWD/gate.seal.json" python scripts/ci_drive_gate.py "$FF_EXE" ${{ matrix.extra }}

      # HIDDEN-DESKTOP + WEBGL-MASKING GUARDS - run the wrapper's e2e checks
      # against THIS leg's freshly-built artifact, on its native runner. The
      # wrapper's headless=True is headed+hidden: on Windows the browser is
      # created on a hidden Win32 desktop (since 2026-09-20; until then the
      # binary cloaked its own window with DWMWA_CLOAK, and this step kept its
      # name so old runs stay findable), on Linux it gets its own Xvfb. Linux
      # (Xvfb + llvmpipe) and Windows (WARP) give a software WebGL context on
      # the GPU-less hosts, so the WebGL-dependent assertions run there.
      # test_hidden_desktop asserts, on Windows, that a headless=True session
      # leaves NO Firefox window on the interactive desktop and has one on its
      # own, after a control arm found a headed window where it belongs, AND
      # that it still renders; Linux self-skips (Xvfb is the e2e.yml path).
      # The webgl guard catches a regression of the gamma readPixels noise back to
      # the scanner-maskable ±1 spike form (covered on Linux + Windows).
      # ⛔ THE CORE COMES FROM GIT, NOT FROM THE INDEX, and this is not a
      # convenience. `pip install ".[dev]"` installs the WRAPPER, which pins
      # invisible-core exactly, so pip resolves the PUBLISHED core - and during a
      # release the published core is always one step behind by construction: its
      # own version is derived from the seal, so it cannot exist until this binary
      # has been built and the seal rolled onto it.
      #
      # That means the pairing this gate used to test - new binary, previous
      # published core - IS ONE NO USER EVER GETS. A user installing core 19.14.0
      # downloads the firefox-19 binary, because that is what its seal pins. The
      # gate was validating an impossible combination.
      #
      # MEASURED on firefox-20, which is where it finally bit: the binary requires
      # zoom.stealth.text.freetype_hintstyle AND freetype_antialias, the published
      # core emits neither, and StealthDeclarationGate refuses. Not at startup -
      # a direct headless launch is fine, which is why the first diagnosis went
      # the wrong way - but on ctx.new_page(), where the browser dies with
      # exitCode 0x80000003 (a deliberate MOZ_CRASH) and Playwright reports
      # TargetClosedError. All five legs failed identically in about a minute,
      # which is the shape of a setup fault and not of five product defects.
      # Bisected with extra_prefs: either declaration alone is not enough, both
      # together revive it, and the shader-language pref is not involved.
      #
      # THE CORE GOES IN FIRST, FROM GIT, AND THE WRAPPER AFTER IT. The core's
      # version is derived from the seal, not bumped per commit, so git and the
      # index can both call themselves 19.14.0: installed first, the git core
      # satisfies the wrapper's exact pin and pip keeps it - same version string,
      # the code under test.
      #
      # It used to go the other way (wrapper first, then the core force-
      # reinstalled with --no-deps), which assumed the version does not move
      # during a release. firefox-47 broke that: the juggler moved to
      # modules/juggler, so the core that ships with the binary is a NEW core
      # (47.x) and the published one (46.x) cannot even find the juggler. With
      # the old order the wrapper of main kept its 46 pin, the import-time
      # enforce_core_pin repaired the core back to 46, and every leg failed on a
      # binary that was fine.
      #
      # ⛔ AND THE CORE-FIRST ORDER FAILED TOO, IN THE WRONG PLACE AND SILENTLY
      # (firefox-51, run 39398286614). It needed a wrapper_ref whose pin names
      # the version core_ref builds, and during a release that version exists
      # only on a transition seal: core_ref built 51.48.0, the wrapper of main
      # pinned 50.48.0, pip put the published core back, and this step PRINTED
      # "core under test: 50.48.0" and went on. The engine refused the launch on
      # the two declarations 50.48.0 does not emit (edge_tolerance,
      # system_quality), and a release build's MOZ_CRASH prints nothing: three
      # legs red with "the browser exited during startup ... printed:
      # (nothing)", which reads as a broken binary. A wrapper branch pinned to
      # 51.48.0 was tried and is not the fix: its own suite runs against the
      # transition seal, which has no assets, and goes red for that.
      #
      # SO THE GATE RUNS EXACTLY core_ref, WHATEVER THE WRAPPER PINS. The wrapper
      # goes in first, for its dependencies; core_ref is force-installed over it
      # from git, with its own dependencies; and the import-time repair that
      # broke firefox-47 is switched off for the whole step with the core's own
      # switches, INVISIBLE_CORE_AUTOFIX=off (no repair) and INVISIBLE_CORE_PIN=
      # allow (the pin mismatch warns instead of refusing the import). Then the
      # core under test is ASSERTED before any browser starts: the git install of
      # exactly core_ref (direct_url.json, which pip writes for a VCS install and
      # an index install does not have), read AFTER importing the wrapper, so a
      # repair that came back any other way is caught here and named.
      # Measured locally on firefox-51's engine: without the two switches the
      # repair reinstalls 50.48.0 and the assertion stops the step with that
      # cause; with them the core stays 51.48.0 and the browser launches and
      # evaluates with no prefs passed by hand.
      #
      # core_ref also goes in BEFORE the wrapper. A wrapper_ref pinned to the
      # version core_ref builds - how the next engine's candidates run, before
      # that core is published - has a pin only core_ref can satisfy: installed
      # first, it is the installed version and pip takes nothing from the index
      # (run 41231675778: "No matching distribution found for
      # invisible-core==54.50.0" on every leg). A pin to another, published
      # version is fetched as before, and the force-reinstall puts core_ref back.
      - name: Cloak + WebGL-masking guards (headed)
        shell: bash
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          INVISIBLE_SEAL_FILE="$PWD/gate.seal.json" INVPW_BINARY_PATH="$FF_EXE" python -m pytest \
            tests/test_hidden_desktop.py \
            "tests/test_fingerprint_surface.py::test_webgl_readpixels_no_masking_signature" \
            tests/test_webgl_draws_on_the_engine_s_own_gl_e2e.py \
            -m e2e -o addopts='' -q

      # HOST GATE, this leg's half: everything the page in the wrapper's
      # scripts/host_gate reads, at three seeds and two DPRs, with core_ref and
      # the seal the guards above ran under. The comparison - every leg against
      # the Windows one, and what does not depend on the identity against retail
      # Firefox for Windows - is the host-gate job below, which needs all legs.
      # It replaced the font gate's question (is the font list the persona's?)
      # with the general one (is anything the host's?). The font gate stayed
      # until this ran green on a release (firefox-55, run 41754346016), then went.
      - name: HOST GATE - what a page reads on this leg
        shell: bash
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          INVISIBLE_SEAL_FILE="$PWD/gate.seal.json" \
            python scripts/ci_host_gate.py dump "$FF_EXE" --leg ${{ matrix.leg }} --out host-dump
      - name: HOST GATE - keep this leg's dump
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-dump-${{ matrix.leg }}
          path: host-dump
          retention-days: 14

  # THE UDP LINE'S E2E, on the leg's own runner and in parallel with the gate above (not behind it): the suites the wrapper
  # lists in ci/required-suites.json, run with the leg's freshly built binary. A required suite cannot be skipped or dropped
  # in silence: scripts/ci_verdict.py fails the job if a listed test did not run and pass, if anything was skipped or
  # deselected, if fewer tests were collected than the list says, or if the list lost a row since main (it only grows).
  # The suite id is the name of the job (wrapper.e2e.udp-<leg>); a suite that outgrows its 15 minutes is split in two ids,
  # its tests are not taken out. The candidate's engine is firefox-63-candidate, so the tests of the UDP line (which skip
  # on an engine older than firefox-63) run here and are never skipped.
  wrapper-e2e:
    name: ${{ matrix.suite }}-${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: wrapper.e2e.udp, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux }
          - { suite: wrapper.e2e.udp, leg: win-x86_64, runner: windows-latest, kind: win, os: windows }
          # the chain by name, whose exit is a documentation address added to lo (`ip addr add`): Linux as root, no Windows leg
          - { suite: wrapper.e2e.udp.exit, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux, root: true }
          # the same road with the browser's sandbox ON, run by a normal user: on this runner AppArmor refuses user namespaces to a user,
          # so every other non-root suite runs a browser without the sandbox of its socket process; this leg turns the restriction off
          - { suite: wrapper.e2e.udp.sandbox, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux, sandbox: true }
          # the routes and HTTP/3 e2e, split from the suite above (500 s of tests on Linux, 14 minutes and more on Windows)
          - { suite: wrapper.e2e.web, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux }
          - { suite: wrapper.e2e.web, leg: win-x86_64, runner: windows-latest, kind: win, os: windows }
          # the unit tests of the line, on both OSes, with the same core and wrapper as the e2e
          - { suite: wrapper.unit.udp, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux }
          - { suite: wrapper.unit.udp, leg: win-x86_64, runner: windows-latest, kind: win, os: windows }
          # the DoH suite: Linux (root: its resolver trap points /etc/resolv.conf at a counting resolver) and Windows, the system
          # of reference (there the trap does not run: the one assertion it makes is the only one not made)
          - { suite: wrapper.e2e.doh, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux, root: true }
          - { suite: wrapper.e2e.doh, leg: win-x86_64, runner: windows-latest, kind: win, os: windows }
          # the realness check without a real proxy (six declared exits, the values a page reads): like the DoH suite, Linux as root
          # without xdist (the resolver trap), Windows without the trap
          - { suite: wrapper.e2e.realness, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux, root: true }
          - { suite: wrapper.e2e.realness, leg: win-x86_64, runner: windows-latest, kind: win, os: windows }
          # the page and popup suites (a page is handed over on Page.ready; a popup reaches the client as Playwright's does)
          - { suite: wrapper.e2e.page, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux }
          - { suite: wrapper.e2e.page, leg: win-x86_64, runner: windows-latest, kind: win, os: windows }
          - { suite: wrapper.unit.page, leg: linux-x86_64, runner: ubuntu-24.04, kind: linux, os: linux }
          - { suite: wrapper.unit.page, leg: win-x86_64, runner: windows-latest, kind: win, os: windows }
    steps:
      - name: Checkout wrapper (its tests, ci/required-suites.json and scripts/ci_verdict.py)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: ${{ inputs.wrapper_ref }}
          fetch-depth: 1
      # The judge and the list it compares against are MAIN's, not the candidate's: a candidate that edits ci_verdict.py or
      # shortens its own list does not judge itself. (Until main has the judge the candidate's own copy runs, said loudly.)
      - name: Checkout wrapper main (the judge and the list that bind the candidate)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: main
          path: wrapper-main
          fetch-depth: 1
      - name: Download asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: asset-${{ matrix.leg }}
          path: art
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ inputs.build_run_id != github.run_id && github.token || '' }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      # The GeoIP database is made by the wrapper (scripts/ci_lab_geoip.py: the same bytes every run, the sha256 in its ci/geoip.json), never a site: without STEALTHFOX_GEOIP_MMDB the core asks GitHub
      # which database is the latest on every call, from the python of the test (run 43211837926: a resolver trap counted github.com and
      # api.github.com as the browser's). The variable reaches every later step of the job, `sudo -E` carries it to a root leg, and the judge
      # turns a leg that launched without it red. The wrapper checked out above is the one that carries the script and the pin: a wrapper_ref without them fails here.
      - name: The GeoIP database (made by the repository, same bytes every run)
        shell: bash
        run: python scripts/ci_lab_geoip.py build --pin ci/geoip.json
      - name: Linux system deps (Firefox runtime libs, a virtual display)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Extract + locate firefox binary
        shell: bash
        run: |
          set -e
          mkdir -p ff
          set -- art/firefox-*-stealth-${{ matrix.leg }}.*
          [ "$#" -eq 1 ] && [ -e "$1" ] || { echo "ERROR: expected one firefox-*-stealth-${{ matrix.leg }} archive in art/, found: $*"; exit 1; }
          A="$1"
          case "${{ matrix.kind }}" in
            win)   python -c "import zipfile; zipfile.ZipFile('$A').extractall('ff')"; EXE="ff/firefox.exe";;
            linux) tar xzf "$A" -C ff; EXE="ff/firefox";;
          esac
          [ -e "$EXE" ] || { echo "ERROR: firefox binary not found at $EXE"; exit 1; }
          chmod +x "$EXE" 2>/dev/null || true
          echo "FF_EXE=$PWD/$EXE" >> "$GITHUB_ENV"
      # The core under test is exactly core_ref, from git, over what the wrapper's pin resolves (the gate above explains why
      # and asserts it; the same switches here).
      - name: The core under test (core_ref, from git) and the wrapper with its dev extra
        shell: bash
        env:
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          CORE_GIT="git+https://github.com/oss-invisible/core@$CORE_REF"
          python -m pip install --quiet "$CORE_GIT"
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet --force-reinstall "$CORE_GIT"
          python - <<'PY'
          import json, os, re, subprocess, sys
          from importlib.metadata import distribution, version
          ref = os.environ["CORE_REF"]
          if re.fullmatch(r"[0-9a-f]{40}", ref):
              want = ref
          else:
              rows = [line.split() for line in subprocess.run(
                  ["git", "ls-remote", "https://github.com/oss-invisible/core", ref, ref + "^{}"],
                  capture_output=True, text=True, check=True).stdout.splitlines() if line.strip()]
              peeled = [s for s, r in rows if r.endswith("^{}")]
              want = (peeled or [s for s, _ in rows] or [""])[0]
          import invisible_playwright  # noqa: F401
          raw = distribution("invisible-core").read_text("direct_url.json")
          got = (json.loads(raw).get("vcs_info") or {}).get("commit_id") if raw else None
          print("core under test: %s from %s" % (version("invisible-core"), got or "the index"))
          if not want or got != want:
              sys.exit("THE CORE UNDER TEST IS NOT core_ref: installed %s from %s, core_ref %r is %s"
                       % (version("invisible-core"), got or "the index", ref, want or "not a ref of invisible_core"))
          PY
      - name: Seal of the binary under test
        shell: bash
        env:
          SEAL_TAG: ${{ inputs.seal_tag }}
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          python -m invisible_core seal --binary "$FF_EXE" --tag "$SEAL_TAG" -o gate.seal.json
      # The sandbox leg: the restriction of AppArmor on user namespaces is turned off, as on any Linux where a user may have them, and the runner
      # user shows that it has one now. The first test of the suite fails if the socket process still has no seccomp filter.
      - name: User namespaces for a normal user (the sandbox leg)
        if: matrix.sandbox
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces 2>&1 || true
          unshare -U true && echo "user namespaces: allowed for $(id -un) (uid $(id -u))"
      # The root legs run an engine that stays under /home/runner (the home of the runner user, mode 750). The socket process is born with
      # CLONE_NEWUSER and does execve INSIDE the new user namespace, where uid 1001 is not mapped and root has no CAP_DAC_OVERRIDE: the
      # execve fails ("exited with status 127"), there is no socket process and the gather of a PeerConnection has no candidate (run
      # 43188313516; reproduced by repos-6b: a home of 755, or an engine of root's, and everything works with the real sandbox, Seccomp: 2).
      # So the engine goes to a path of root's that everyone can read, before the root steps, and FF_EXE points there.
      - name: The engine where root can run it (the root legs)
        if: matrix.root
        shell: bash
        run: |
          sudo rm -rf /opt/ff
          sudo cp -a "$(dirname "$FF_EXE")" /opt/ff
          sudo chown -R root:root /opt/ff
          sudo chmod -R go+rX /opt/ff
          ls -ld /opt /opt/ff /opt/ff/firefox
          echo "FF_EXE=/opt/ff/$(basename "$FF_EXE")" >> "$GITHUB_ENV"
      - name: The suite - every listed test runs and passes
        shell: bash
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          export INVISIBLE_SEAL_FILE="$PWD/gate.seal.json" INVPW_BINARY_PATH="$FF_EXE" STEALTHFOX_E2E_BINARY="$FF_EXE"
          mkdir -p result
          # The log of a job that is cancelled is what pytest had written: unbuffered, so that it says how far the suite got.
          export PYTHONUNBUFFERED=1
          # The engine's log of the UDP layer, a file per process, kept with the result: what the browser said is the only way
          # to tell a product that was slow from a test that was wrong (the e2e of run 43164943499 could not be told apart).
          case "${{ matrix.suite }}" in
            *e2e*)
              LOGDIR="$(python -c "import os; os.makedirs('result/moz-logs', exist_ok=True); print(os.path.abspath('result/moz-logs'))")"
              # `timestamp`: a time on every line (the logs of run 43188313516 had none, and a red on Windows could not be read against the test's own times)
              export MOZ_LOG="timestamp,sync,SOCKS-UDP:5" MOZ_LOG_FILE="$LOGDIR/moz-%PID.log"
              # the HTTP/3 e2e: what the browser says of the QUIC it starts (a visit that reads h2 where h3 was due)
              if [ "${{ matrix.suite }}" = "wrapper.e2e.web" ]; then export MOZ_LOG="$MOZ_LOG,nsHttp:5,neqo_http3:5"; fi
              # the root legs (run 43188313516: the socket process of every one wrote nothing, the gather had no candidate): the
              # transport and the sandbox that starts that process
              if [ "${{ matrix.root }}" = "true" ] || [ "${{ matrix.sandbox }}" = "true" ]; then export MOZ_LOG="$MOZ_LOG,mtransport:5,SandboxBroker:5,SandboxTarget:5"; fi;;
          esac
          JUDGE=scripts/ci_verdict.py
          [ -f wrapper-main/scripts/ci_verdict.py ] && JUDGE=wrapper-main/scripts/ci_verdict.py
          echo "JUDGE=$JUDGE" >> "$GITHUB_ENV"
          python "$JUDGE" args --required ci/required-suites.json --suite "${{ matrix.suite }}" --os "${{ matrix.os }}" --with-marker > result/args.txt
          mapfile -t SELECT < <(tr -d '\r' < result/args.txt)
          # no PYTEST_ADDOPTS from the environment, no rerun plugin (a test that passes on its second try is not green), junit
          # in the xunit2 family (the judge reads the class of every test from it)
          PYTEST=(python -m pytest "${SELECT[@]}" -o addopts='' -o junit_family=xunit2 -q -p no:cacheprovider -p no:rerunfailures -rs --junitxml="result/${{ matrix.suite }}.${{ matrix.os }}.xml")
          if [ "${{ matrix.root }}" = "true" ]; then
            # The trap listens on port 53 of a loopback address and points /etc/resolv.conf at it (it takes the first of
            # 127.0.0.1... it can bind). The runner's own stub resolver is NOT stopped: stopping it took the DNS of the runner
            # with it, and the result of the job could not be uploaded (run 43164943499: EAI_AGAIN). What listens is said
            # whole, before the suite, so that a port the trap cannot bind has its holder in the log.
            (ss -lntup 2>/dev/null || netstat -lntup 2>/dev/null) || echo "no ss or netstat on this runner"
            # -H: the browser must not see the runner's home as another user's. -u XDG_RUNTIME_DIR: Firefox refuses to run as
            # root when that directory belongs to the runner's user ("Running Nightly as root in a regular user's session is
            # not supported", run 43164943499). The trap must run: a test that cannot make it fails instead of going on
            # without its assertion.
            # DIAGNOSTICS of the root legs, kept with the result in result/root-diag/ (they judge nothing): the kernel's say on
            # user namespaces and AppArmor, the processes of the browser a few times during the run, and what the kernel logged.
            mkdir -p result/root-diag
            { sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces \
                kernel.yama.ptrace_scope 2>&1; id; cat /proc/self/status | grep -i -E "^(Cap|Seccomp|NoNewPrivs)"; } > result/root-diag/kernel.txt 2>&1 || true
            ( for _ in $(seq 1 40); do date +%T; { ps -eo pid,ppid,user,stat,args | grep -i -E "[f]irefox|[X]vfb" | cut -c1-260; } || true; sleep 15; done ) \
              > result/root-diag/ps.log 2>&1 &
            # What the environment of THIS launch says about the GeoIP database (the judge reads it): through the same sudo as pytest.
            sudo -H -E env -u PYTEST_ADDOPTS -u XDG_RUNTIME_DIR "PATH=$PATH" python scripts/ci_lab_geoip.py evidence --out result/geoip.json > /dev/null
            sudo -H -E env -u PYTEST_ADDOPTS -u XDG_RUNTIME_DIR INVPW_REQUIRE_TRAP=1 "PATH=$PATH" "${PYTEST[@]}" || true
            sudo dmesg 2>&1 | grep -i -E "apparmor|DENIED|seccomp|userns" | tail -80 > result/root-diag/dmesg.txt || true
          else
            env -u PYTEST_ADDOPTS python scripts/ci_lab_geoip.py evidence --out result/geoip.json > /dev/null
            env -u PYTEST_ADDOPTS "${PYTEST[@]}" || true
          fi
      # The verdict, whatever pytest said: a skipped test, a missing file or a list that shrank is red here.
      # The leg ran with the pinned GeoIP database and the core never went past it to GitHub: checked HERE, with the script of the wrapper, whatever the
      # judge below knows (a judge of main that does not read the evidence yet is a window until the first merge; this step is not).
      - name: The leg ran with the pinned GeoIP database
        if: always()
        shell: bash
        run: |
          GEOIP_PIN=ci/geoip.json
          [ -f wrapper-main/ci/geoip.json ] && GEOIP_PIN=wrapper-main/ci/geoip.json
          python scripts/ci_lab_geoip.py verify --pin "$GEOIP_PIN" --evidence result/geoip.json --used "$GEOIP_USED_OUT"
      - name: Verdict - required suite
        shell: bash
        run: |
          # main's list is read from the checkout of main above: a failed download cannot pass for "main has no list".
          if [ -f wrapper-main/ci/required-suites.json ]; then
            MAIN=(--main-required wrapper-main/ci/required-suites.json)
          else
            echo "::warning::wrapper main has no ci/required-suites.json yet: nothing to compare the list with (the first merge to main ends this)"
            MAIN=(--main-required wrapper-main/ci/required-suites.json --main-has-no-list)
          fi
          [ "$JUDGE" = "scripts/ci_verdict.py" ] && echo "::warning::wrapper main has no ci_verdict.py yet: the candidate's own judge runs (the first merge to main ends this)"
          # A leg that launched without the GeoIP database of the pin is red. Until main's judge reads the evidence (the first merge to
          # main ends this) the legs still write it and that judge is not asked to; said loudly.
          GEOIP=()
          GEOIP_PIN=ci/geoip.json
          [ -f wrapper-main/ci/geoip.json ] && GEOIP_PIN=wrapper-main/ci/geoip.json
          if grep -q -- '--geoip-pin' "$JUDGE"; then
            GEOIP=(--geoip result/geoip.json --geoip-pin "$GEOIP_PIN")
          else
            echo "::warning::the judge ($JUDGE) does not read the GeoIP evidence yet: the leg is not judged on its database"
          fi
          python "$JUDGE" judge --required ci/required-suites.json --suite "${{ matrix.suite }}" --os "${{ matrix.os }}" \
            --junit "result/${{ matrix.suite }}.${{ matrix.os }}.xml" --binary "$FF_EXE" --seal gate.seal.json \
            --commit "$(git rev-parse HEAD)" "${MAIN[@]}" "${GEOIP[@]}" --out "result/${{ matrix.suite }}.${{ matrix.os }}.json"
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: result-${{ matrix.suite }}-${{ matrix.os }}
          path: result
          retention-days: 14

  # Every row of the list, on every OS it names, has a verdict in this run, and it is green. The matrix above is written by hand;
  # a row or an OS that nobody put in it would otherwise be a suite that never ran and a job that never failed.
  wrapper-e2e-complete:
    name: wrapper-e2e-complete
    needs: wrapper-e2e
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper (the candidate's list)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: ${{ inputs.wrapper_ref }}
          fetch-depth: 1
      - name: Checkout wrapper main (the judge)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: main
          path: wrapper-main
          fetch-depth: 1
      - name: Every verdict of the run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: result-*
          path: results
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: The list and the verdicts agree
        shell: bash
        run: |
          JUDGE=scripts/ci_verdict.py
          [ -f wrapper-main/scripts/ci_verdict.py ] && JUDGE=wrapper-main/scripts/ci_verdict.py
          python "$JUDGE" complete --required ci/required-suites.json --results results

  # HOST GATE, the comparison. What a page reads is a function of the declared
  # identity and of Firefox's code: the same seed gives the same bytes on every
  # leg, and a value no seed changes is retail's. The only exceptions are in the
  # wrapper's scripts/host_gate/exceptions.json, each with its reason, and a
  # known defect that is no longer seen fails here so the list only shrinks.
  host-gate:
    name: host-gate
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout wrapper (for scripts/ci_host_gate.py and its reference)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: ${{ inputs.wrapper_ref }}
          fetch-depth: 1
      - name: Every leg's dump
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: host-dump-*
          merge-multiple: true
          path: host-dump
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: HOST GATE - the same on every host, retail's where the identity does not decide
        run: python scripts/ci_host_gate.py compare host-dump
