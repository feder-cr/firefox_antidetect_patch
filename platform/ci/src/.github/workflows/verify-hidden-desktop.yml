# ─────────────────────────────────────────────────────────────────────────────
# verify-hidden-desktop.yml — re-run the GATE on an EXISTING build run's
# artifacts, WITHOUT rebuilding Firefox: a test-only fix (e.g. a leg made
# tolerant of the runner's missing WebGL) is validated against the real
# binaries in ~10 minutes instead of a rebuild. Si chiamava verify-cloak.yml
# fino al 2026-09-20; i guard sono quelli del wrapper sul desktop nascosto e il test
# WebGL del wrapper.
#
# It CALLS gate.yml, the same job release.yml and republish.yml call. Until
# 2026-10-27 it was its own copy, which said "same guard command as
# release.yml's gate" and was not: it installed the PUBLISHED core and no
# seal, the pairing gate.yml documents as one no user gets (it broke
# firefox-20 and firefox-47). One gate, three callers, no copy to drift.
#
# Headed-but-hidden; zero proxy / zero secrets.
#
# ⛔ Fino al 2026-08-26 questa intestazione diceva "The macOS legs are the only
# place the cocoa cloak patch actually RUNS". Da quel giorno le gambe mac sono
# uscite, quindi il cloak cocoa NON viene piu' esercitato da nessuna parte: e'
# la conseguenza di aver smesso di spedire per mac, detta invece che cancellata.
# ─────────────────────────────────────────────────────────────────────────────
name: verify-hidden-desktop

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build run id whose asset-* artifacts to re-gate (e.g. 27346856197)'
        required: true
      wrapper_ref:
        description: 'invisible_playwright ref to drive the binaries with'
        default: 'main'
      core_ref:
        description: 'invisible_core ref the gate installs (the one the binaries were built for); empty is main'
        default: ''
      seal_tag:
        description: 'the engine the binaries are, as the seal names it: firefox-N or firefox-N-candidate. Empty: the candidate after the last release'
        default: ''

permissions:
  contents: read
  actions: read   # download-artifact needs this to read another run's artifacts

jobs:
  # The seal's tag says which engine the wrapper's e2e are driving (tests/conftest.py,
  # engine_at_least): a number, never `local`. Named as release.yml's plan names a candidate.
  seal:
    runs-on: ubuntu-24.04
    outputs:
      seal_tag: ${{ steps.tag.outputs.seal_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - id: tag
        env:
          SEAL_TAG: ${{ inputs.seal_tag }}
        run: |
          set -e
          if [ -z "$SEAL_TAG" ]; then
            RELEASE_TAGS="$(git ls-remote --tags "https://github.com/${{ github.repository }}" 'firefox-*' | sed -n 's#.*refs/tags/\(firefox-[0-9]*\)$#\1#p')"
            SEAL_TAG="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import release_plan; print(release_plan.candidate_seal_tag(sys.argv[1]))' "$RELEASE_TAGS")"
          fi
          echo "seal_tag=$SEAL_TAG" | tee -a "$GITHUB_OUTPUT"
  gate:
    needs: seal
    uses: ./.github/workflows/gate.yml
    with:
      build_run_id: ${{ inputs.run_id }}
      # the engine under re-gate, named by number (scripts/release_plan.py)
      seal_tag: ${{ needs.seal.outputs.seal_tag }}
      wrapper_ref: ${{ inputs.wrapper_ref }}
      core_ref: ${{ inputs.core_ref || 'main' }}
